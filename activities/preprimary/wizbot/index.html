<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizbot Maxx — Student Quick-Start Poster</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#e9e9e9}
  body{
    display:flex;justify-content:center;padding:24px;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- POSTER SHELL ---------- */
  .poster{
    position:relative;
    width:900px;
    min-height:1273px;
    background:#fff;
    color:#000;
    overflow:hidden;
    padding:40px;
    display:flex;
    flex-direction:column;
    box-shadow:0 12px 48px rgba(0,0,0,.28);
  }

  /* ---------- DOTTED GRID BACKGROUND ---------- */
  .poster::before{
    content:"";
    position:absolute;inset:0;
    background-image:radial-gradient(circle,#000 1.5px,transparent 1.6px);
    background-size:24px 24px;
    background-position:12px 12px;
    opacity:.30;
    z-index:0;
    pointer-events:none;
  }

  /* ---------- LAYERS ---------- */
  .layer{
    position:absolute;inset:0;
    width:100%;height:100%;
    z-index:1;
    pointer-events:none;
  }
  .content{
    position:relative;z-index:2;
    display:flex;flex-direction:column;gap:16px;
    flex:1;
  }

  /* ---------- HEADER ---------- */
  .head-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .chip{
    display:inline-block;border:2px solid #000;border-radius:999px;
    padding:4px 12px;font-size:11px;font-weight:800;letter-spacing:1.8px;
  }
  .head h1{
    margin:12px 0 0;font-size:74px;font-weight:900;
    letter-spacing:5px;line-height:.95;
  }
  .head .sub{
    margin:8px 0 0;font-size:17px;letter-spacing:.4px;opacity:.82;font-weight:500;
  }

  /* ---------- BAND ---------- */
  .band{
    background:#000;color:#fff;border-radius:10px;
    padding:8px 18px;font-size:15px;font-weight:900;letter-spacing:3.5px;
  }

  /* ---------- CARDS ---------- */
  .card{
    border:3px solid #000;border-radius:16px;
    background:rgba(255,255,255,.90);
    padding:14px 18px;
  }
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .num{
    flex:0 0 auto;width:30px;height:30px;border-radius:50%;
    background:#000;color:#fff;font-weight:900;font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .card h2{margin:0;font-size:19px;font-weight:900;letter-spacing:1.6px}
  .card p{margin:0;font-size:14.5px;line-height:1.38}

  /* ---------- BATTERY ---------- */
  .battery-body{display:flex;gap:20px;align-items:center}
  .battery-body .batt{flex:0 0 auto}
  .key-line{
    font-size:16px;font-weight:900;letter-spacing:.6px;margin-bottom:6px !important;
  }
  .note{
    margin-top:6px !important;font-size:12.5px !important;
    border-top:2px dotted #000;padding-top:6px;
  }

  /* ---------- BUTTON STRIP ---------- */
  .btn-row{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 8px}
  .key{
    border:2px solid #000;border-radius:8px;padding:4px 10px;
    font-size:12px;font-weight:800;letter-spacing:.6px;background:#fff;
  }
  .key.solid{background:#000;color:#fff}

  /* ---------- MODES ---------- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .mode{border:2px dashed #000;border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.72)}
  .mode h3{margin:0 0 5px;font-size:14px;font-weight:900;letter-spacing:1.4px}
  .mode p{font-size:13px;line-height:1.35}

  /* ---------- FOOTER / QR ---------- */
  .footer{
    margin-top:auto;
    display:flex;gap:18px;align-items:center;
    border:3px solid #000;border-radius:16px;
    background:rgba(255,255,255,.94);
    padding:14px 18px;
  }
  .qr{
    flex:0 0 auto;width:148px;height:148px;
    border:2px solid #000;background:#fff;padding:6px;
    display:flex;align-items:center;justify-content:center;
  }
  .qr canvas,.qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
  .qr-fail{font-size:13px;font-weight:900;letter-spacing:2px;text-align:center;line-height:1.4}
  .footer-text h2{margin:0 0 4px;font-size:18px;font-weight:900;letter-spacing:1.6px}
  .footer-text p{font-size:13.5px;line-height:1.4;margin:0}
  .url{
    display:inline-block;margin-top:8px;
    border:2px solid #000;border-radius:8px;
    padding:4px 10px;font-size:12px;font-weight:800;
    letter-spacing:.3px;word-break:break-all;
  }
  .trace{
    margin-top:6px;font-size:12.5px;font-weight:700;letter-spacing:.3px;
  }

  /* ---------- PRINT ---------- */
  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff;padding:0;display:block}
    .poster{box-shadow:none;margin:0;width:210mm;height:297mm;min-height:0}
  }
  @media (max-width:960px){
    body{padding:10px}
    .poster{transform-origin:top left}
  }
</style>
</head>
<body>

<div class="poster" id="poster"></div>

<!-- QR generator (offline canvas). If CDN fails we fall back to an image API. -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<script>
/* ============================================================
   WIZBOT MAXX — QUICK-START POSTER GENERATOR
   ============================================================ */

const POSTER_LINK = "https://edulabs.technikh.com/activities/preprimary/wizbot";

/* ------------------------------------------------------------
   1. DASHED SHAPE OVERLAY  (triangle · circle · 1 · 4 · 7)
   ------------------------------------------------------------ */
const MONO = "ui-monospace, 'Courier New', monospace";

const shapesSVG = `
<svg class="layer" viewBox="0 0 900 1273" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="#000" stroke-width="3"
     stroke-dasharray="13 11" stroke-linejoin="round" stroke-linecap="round"
     opacity="0.55">

    <!-- CIRCLE -->
    <circle cx="450" cy="650" r="300"/>

    <!-- TRIANGLE -->
    <polygon points="450,190 130,850 770,850"/>

    <!-- NUMBER 1 -->
    <text x="30" y="620" font-family="${MONO}" font-size="520" font-weight="900" fill="none">1</text>

    <!-- NUMBER 4 -->
    <text x="290" y="1010" font-family="${MONO}" font-size="520" font-weight="900" fill="none">4</text>

    <!-- NUMBER 7 -->
    <text x="560" y="700" font-family="${MONO}" font-size="520" font-weight="900" fill="none">7</text>
  </g>
</svg>`;

/* ------------------------------------------------------------
   2. BATTERY DIAGRAM (inline SVG, dashed, B/W)
   ------------------------------------------------------------ */
const batterySVG = `
<svg class="batt" viewBox="0 0 300 78" width="300" height="78" aria-hidden="true">
  <!-- compartment -->
  <rect x="4" y="10" width="292" height="58" rx="12" fill="none" stroke="#000" stroke-width="3"/>

  <!-- three AAA cells -->
  <g fill="none" stroke="#000" stroke-width="2.6" stroke-dasharray="7 5">
    <rect x="22" y="22" width="76" height="34" rx="6"/>
    <rect x="112" y="22" width="76" height="34" rx="6"/>
    <rect x="202" y="22" width="76" height="34" rx="6"/>
  </g>

  <!-- spring coil at the MINUS end -->
  <path d="M26 39 l5 -9 v18 l6 -18 v18 l6 -18 v18 l5 -9"
        fill="none" stroke="#000" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- polarity marks -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle">
    <text x="112" y="48">–</text><text x="190" y="48">+</text>
    <text x="202" y="48">–</text><text x="280" y="48">+</text>
  </g>

  <!-- AAA labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="800"
     text-anchor="middle" fill="#000" opacity=".7">
    <text x="70" y="45">AAA</text>
    <text x="160" y="45">AAA</text>
    <text x="250" y="45">AAA</text>
  </g>
</svg>`;

/* ------------------------------------------------------------
   3. POSTER MARKUP
   ------------------------------------------------------------ */
const posterHTML = `
${shapesSVG}

<div class="content">

  <!-- ================= HEADER ================= -->
  <header class="head">
    <div class="head-row">
      <span class="chip">STUDENT QUICK-START</span>
      <span class="chip">AGES 4–10 · SCREEN-FREE</span>
    </div>
    <h1>WIZBOT&nbsp;MAXX</h1>
    <p class="sub">Press a button → queue a move → press GO → watch it draw.</p>
  </header>

  <!-- ================= 1. BATTERY ================= -->
  <section class="card">
    <div class="card-head">
      <span class="num">1</span>
      <h2>EASY BATTERY POWER</h2>
    </div>
    <div class="battery-body">
      ${batterySVG}
      <div>
        <p class="key-line">3 × AAA batteries · FLAT MINUS (–) END AGAINST THE SPRING.</p>
        <p>Slide open the latch on the bottom panel, match the + / – marks, then click the
           cover shut so power never cuts out mid-move.</p>
        <p class="note">Always swap all three at once, same brand — mixed batteries cause
           wobbly steps and bad turns.</p>
      </div>
    </div>
  </section>

  <!-- ================= BAND ================= -->
  <div class="band">HOW TO CODE &amp; PLAY</div>

  <!-- ================= 2. BUTTON CODING ================= -->
  <section class="card">
    <div class="card-head">
      <span class="num">2</span>
      <h2>ON-BOARD BUTTON CODING</h2>
    </div>
    <p>Tap <b>CLEAR</b> first, tap your moves in order, then tap <b>GO</b>. Wizbot stores the
       whole sequence in its memory and runs it step by step.</p>
    <div class="btn-row">
      <span class="key solid">CLEAR ✕</span>
      <span class="key">▲ FORWARD</span>
      <span class="key">▼ REVERSE</span>
      <span class="key">◀ LEFT</span>
      <span class="key">▶ RIGHT</span>
      <span class="key">✱ ACTION</span>
      <span class="key">↺ REPEAT</span>
      <span class="key solid">GO</span>
    </div>
    <p>Slide the power switch to the middle position to start screen-free coding.</p>
  </section>

  <!-- ================= 3. GRID vs DRAW ================= -->
  <section class="card">
    <div class="card-head">
      <span class="num">3</span>
      <h2>GRID MODE vs. DRAW MODE</h2>
    </div>
    <p style="margin-bottom:8px">Press <b>ACTION + REVERSE</b> together to toggle between the two modes.</p>
    <div class="modes">
      <div class="mode">
        <h3>◉ GRID MODE · ORANGE LED</h3>
        <p>Mat play. 90° turns, one full square per step. Perfect for mazes, treasure hunts
           and cell-by-cell paths.</p>
      </div>
      <div class="mode">
        <h3>◉ DRAW MODE · PURPLE LED</h3>
        <p>Pen play. 45° and 30° turns, 1s / 3s arcs, circles and loops. Clip a sketch pen
           into the centre holder.</p>
      </div>
    </div>
  </section>

  <!-- ================= 4. PICTO CODING ================= -->
  <section class="card">
    <div class="card-head">
      <span class="num">4</span>
      <h2>APP-BASED PICTO CODING</h2>
    </div>
    <p>
      <b>1.</b> Switch power to Picto-Coding — the LED turns <b>blue</b>.&nbsp;
      <b>2.</b> Open <b>Junior Blocks</b> on tablet / laptop.&nbsp;
      <b>3.</b> Go to <b>Board ▸ Wizbot Maxx</b> and pick your robot's ID (listen for the chime).&nbsp;
      <b>4.</b> Drag puzzle blocks — move, turn, LED colour, sound, loops — then press <b>Run</b>.
    </p>
  </section>

  <!-- ================= FOOTER + QR ================= -->
  <footer class="footer">
    <div class="qr" id="qrbox"></div>
    <div class="footer-text">
      <h2>SCAN TO START THE ACTIVITY</h2>
      <p>Point your camera at the code to open the full Wizbot Maxx activity page —
         lesson steps, mat layouts and printable shape sheets.</p>
      <span class="url">${POSTER_LINK}</span>
      <p class="trace">✎ Challenge: code Wizbot to trace the dashed circle, the triangle and the numbers 1 · 4 · 7.</p>
    </div>
  </footer>

</div>
`;

document.getElementById("poster").insertAdjacentHTML("afterbegin", posterHTML);

/* ------------------------------------------------------------
   4. QR CODE RENDERING
   ------------------------------------------------------------ */
(function mountQR() {
  const box = document.getElementById("qrbox");
  if (!box) return;

  const fail = () => {
    box.innerHTML = '<span class="qr-fail">QR<br>CODE<br>↗</span>';
  };

  const useImageFallback = () => {
    const img = new Image();
    img.alt = "QR code for the Wizbot Maxx activity page";
    img.onerror = fail;
    img.src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data=" +
              encodeURIComponent(POSTER_LINK);
    box.appendChild(img);
  };

  if (window.QRCode && typeof window.QRCode.toCanvas === "function") {
    const canvas = document.createElement("canvas");
    window.QRCode.toCanvas(
      canvas,
      POSTER_LINK,
      { width: 300, margin: 0, errorCorrectionLevel: "M",
        color: { dark: "#000000", light: "#ffffff" } },
      (err) => (err ? useImageFallback() : box.appendChild(canvas))
    );
  } else {
    useImageFallback();
  }
})();

/* ------------------------------------------------------------
   5. RESPONSIVE SCALE-TO-FIT (screen only)
   ------------------------------------------------------------ */
(function fitToScreen() {
  const poster = document.getElementById("poster");
  const apply = () => {
    poster.style.transform = "";
    poster.style.marginBottom = "0";
    if (window.innerWidth < 980) {
      const scale = Math.min(1, (window.innerWidth - 40) / 900);
      poster.style.transformOrigin = "top left";
      poster.style.transform = `scale(${scale})`;
      poster.style.marginBottom = `${(scale - 1) * poster.offsetHeight}px`;
    }
  };
  apply();
  window.addEventListener("resize", apply);
})();
</script>
</body>
</html>
