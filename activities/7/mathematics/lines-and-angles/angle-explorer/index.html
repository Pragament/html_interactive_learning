<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angle Explorer</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:18px;font-family:"Segoe UI",system-ui,sans-serif;background:#f3f1fb;color:#20203b}.app{width:min(1080px,100%);margin:auto;display:grid;gap:16px}header,.panel{background:#fff;border:1px solid #ddd8ee;border-radius:8px;box-shadow:0 10px 28px #30225c12}header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1,p{margin:0}h1{font-size:clamp(1.6rem,4vw,2.4rem)}header p{color:#6f6b82;margin-top:5px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{padding:18px}canvas{display:block;width:100%;height:auto;background:#faf9ff;border:1px solid #e2def2;border-radius:8px;cursor:crosshair;touch-action:none}.controls{display:grid;gap:16px}label{display:grid;gap:8px;font-weight:800}input{width:100%;accent-color:#6651a8}.angle{text-align:center;font-size:clamp(2rem,7vw,4rem);font-weight:900;color:#6651a8}.badge{text-align:center;padding:14px;border-radius:8px;background:#eeeafd;color:#493b85;font-size:1.4rem;font-weight:900}.note{padding:12px;background:#f7faf8;border-left:5px solid #237a54;line-height:1.5}button{border:0;border-radius:8px;min-height:42px;padding:0 14px;background:#6651a8;color:#fff;font-weight:850;cursor:pointer}@media(max-width:780px){.grid{grid-template-columns:1fr}}
  </style>
<script type="application/json" id="activity-metadata">
{
  "schemaVersion": 1,
  "id": "7-mathematics-lines-and-angles-angle-explorer",
  "order": 105,
  "class": "VII",
  "subject": "Mathematics",
  "topic": "Lines and Angles",
  "subtopic": null,
  "title": "Angle Explorer",
  "description": "Move a ray to create angles and identify acute, right, obtuse, straight, and reflex angles.",
  "activityType": "exploration",
  "status": "active"
}
</script>
</head>
<body><main class="app"><header><div><h1>Angle Explorer</h1><p>Drag the slider to make an angle and identify its type.</p></div><button id="random">New angle</button></header><section class="grid"><div class="panel"><canvas id="canvas" width="700" height="500"></canvas></div><aside class="panel controls"><label>Angle: <span id="value">90</span>°<input id="angle" type="range" min="0" max="360" value="90"></label><div class="angle" id="angleText"></div><div class="badge" id="type"></div><div class="note" id="note"></div></aside></section></main>
  <script>
    const canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d"),input=document.querySelector("#angle"),value=document.querySelector("#value"),angleText=document.querySelector("#angleText"),type=document.querySelector("#type"),note=document.querySelector("#note");
    function render(){const a=Number(input.value),rad=a*Math.PI/180,cx=350,cy=285,len=190;ctx.clearRect(0,0,700,500);ctx.strokeStyle="#ded9ef";ctx.lineWidth=1;for(let x=50;x<700;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,500);ctx.stroke()}for(let y=50;y<500;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(700,y);ctx.stroke()}ctx.strokeStyle="#6651a8";ctx.lineWidth=7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+len,cy);ctx.moveTo(cx,cy);ctx.lineTo(cx+len*Math.cos(rad),cy-len*Math.sin(rad));ctx.stroke();ctx.fillStyle="#c84b31";ctx.beginPath();ctx.arc(cx,cy,9,0,Math.PI*2);ctx.fill();value.textContent=a;angleText.textContent=a+"°";const label=a===0||a===360?"Zero/full angle":a<90?"Acute angle":a===90?"Right angle":a<180?"Obtuse angle":a===180?"Straight angle":"Reflex angle";type.textContent=label;note.textContent=a===90?"A right angle is exactly one quarter turn.":a===180?"A straight angle forms a line.":"A full turn is 360°. Compare this angle with 90° and 180°."}
    let dragging=false;function setFromPoint(event){const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*canvas.width/rect.width-350,y=(event.clientY-rect.top)*canvas.height/rect.height-285;let degrees=Math.round(Math.atan2(-y,x)*180/Math.PI);if(degrees<0)degrees+=360;input.value=degrees;render()}canvas.onpointerdown=event=>{dragging=true;canvas.setPointerCapture(event.pointerId);setFromPoint(event)};canvas.onpointermove=event=>{if(dragging)setFromPoint(event)};canvas.onpointerup=()=>{dragging=false};input.oninput=render;document.querySelector("#random").onclick=()=>{input.value=[30,45,60,90,120,150,180,270][Math.floor(Math.random()*8)];render()};render();
  </script>
</body>
</html>
