<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraction Visualizer</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:18px;font-family:"Segoe UI",system-ui,sans-serif;background:#fff8ef;color:#2d2430}.app{width:min(1080px,100%);margin:auto;display:grid;gap:16px}header,.panel{background:#fff;border:1px solid #ead9c5;border-radius:8px;box-shadow:0 10px 28px #56351812}header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1,p{margin:0}h1{font-size:clamp(1.6rem,4vw,2.4rem)}header p{color:#786b62;margin-top:5px}.grid{display:grid;grid-template-columns:1fr .8fr;gap:16px}.panel{padding:18px}.pizza{width:min(390px,80vw);aspect-ratio:1;margin:10px auto;border-radius:50%;background:#f5eadb;border:10px solid #9a5b30;position:relative;overflow:hidden}.slice{position:absolute;inset:0;clip-path:polygon(50% 50%,50% 0,100% 0,100% 50%);transform-origin:50% 50%;background:#f6c65b;border:1px solid #fff;cursor:pointer}.slice.selected{background:#e4774f}.readout{text-align:center;font-size:clamp(1.8rem,6vw,3.2rem);font-weight:900;color:#9a5b30}.controls{display:grid;gap:14px}label{display:grid;gap:8px;font-weight:800}input[type=range]{width:100%;accent-color:#9a5b30}.note{padding:12px;background:#f7faf8;border-left:5px solid #237a54;border-radius:8px;line-height:1.5}button{border:0;border-radius:8px;min-height:42px;padding:0 14px;background:#9a5b30;color:#fff;font-weight:850;cursor:pointer}@media(max-width:780px){.grid{grid-template-columns:1fr}}
  </style>
<script type="application/json" id="activity-metadata">
{
  "schemaVersion": 1,
  "id": "7-mathematics-fractions-and-decimals-fraction-visualizer",
  "order": 103,
  "class": "VII",
  "subject": "Mathematics",
  "topic": "Fractions and Decimals",
  "subtopic": null,
  "title": "Fraction Visualizer",
  "description": "Click equal pizza slices to represent fractions and connect shaded parts with decimal values.",
  "activityType": "exploration",
  "status": "active"
}
</script>
</head>
<body><main class="app"><header><div><h1>Fraction Visualizer</h1><p>Click pizza slices to build a fraction and see its decimal value.</p></div><button id="new">Clear pizza</button></header><section class="grid"><div class="panel"><div class="pizza" id="pizza"></div><div class="readout" id="readout"></div></div><aside class="panel controls"><label>Number of equal parts: <span id="denText">8</span><input id="den" type="range" min="2" max="12" value="8"></label><div class="note" id="note"></div><p style="line-height:1.5;color:#786b62">Try making an equivalent fraction, such as 1/2 and 4/8. What decimal do they share?</p></aside></section></main>
  <script>
    const pizza=document.querySelector("#pizza"),den=document.querySelector("#den"),denText=document.querySelector("#denText"),readout=document.querySelector("#readout"),note=document.querySelector("#note");let selected=new Set();
    function render(){const count=Number(den.value);denText.textContent=count;selected=new Set([...selected].filter(i=>i<count));pizza.innerHTML="";for(let i=0;i<count;i++){const s=document.createElement("button");s.className="slice"+(selected.has(i)?" selected":"");s.style.transform=`rotate(${i*360/count}deg)`;s.setAttribute("aria-label",`slice ${i+1}`);s.onclick=()=>{selected.has(i)?selected.delete(i):selected.add(i);render()};pizza.append(s)}const value=selected.size/count;readout.textContent=`${selected.size}/${count} = ${value.toFixed(3)}`;note.textContent=selected.size===0?"Click slices to shade a fraction.":`${selected.size} of ${count} parts are shaded. Decimal: ${value.toFixed(3)}.`}
    den.oninput=render;document.querySelector("#new").onclick=()=>{selected.clear();render()};render();
  </script>
</body>
</html>
