<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Area Builder</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:18px;font-family:"Segoe UI",system-ui,sans-serif;background:#f4f1ea;color:#1e293b}.app{width:min(1080px,100%);margin:auto;display:grid;gap:16px}header,.panel{background:#fff;border:1px solid #e2d7c7;border-radius:8px;box-shadow:0 10px 28px #3f2c1914}header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1,p{margin:0}h1{font-size:clamp(1.6rem,4vw,2.4rem)}header p{color:#756858;margin-top:5px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{padding:18px}canvas{width:100%;height:auto;display:block;background:#fbfaf7;border:1px solid #eadfce;border-radius:8px}.controls{display:grid;gap:15px}label{display:grid;gap:8px;font-weight:800;color:#513f2c}input{width:100%;accent-color:#9a5b30}.formula{text-align:center;font-size:clamp(1.6rem,5vw,2.5rem);font-weight:900;color:#7a3e1d;padding:16px;border-radius:8px;background:#fff7e8;border:1px solid #ead4a9}.result{text-align:center;font-size:1.35rem;font-weight:900;color:#17613f}.note{line-height:1.5;background:#f7faf8;border-left:5px solid #237a54;padding:12px;border-radius:8px}@media(max-width:780px){.grid{grid-template-columns:1fr}}
  </style>
<script type="application/json" id="activity-metadata">
{
  "schemaVersion": 1,
  "id": "7-mathematics-perimeter-and-area-area-builder-area-builder",
  "order": 106,
  "class": "VII",
  "subject": "Mathematics",
  "topic": "Perimeter and Area",
  "subtopic": "Area Builder",
  "title": "Area Builder — Area Builder",
  "description": "Change the length and breadth of a rectangle, count grid squares, and calculate area and perimeter.",
  "activityType": "exploration",
  "status": "active"
}
</script>
</head>
<body><main class="app"><header><div><h1>Area Builder</h1><p>Change length and breadth to build rectangles and compare area with perimeter.</p></div><button id="random">Random rectangle</button></header><section class="grid"><div class="panel"><canvas id="canvas" width="720" height="540"></canvas></div><aside class="panel controls"><label>Length: <span id="lText">8</span> units<input id="length" type="range" min="2" max="14" value="8"></label><label>Breadth: <span id="bText">5</span> units<input id="breadth" type="range" min="2" max="10" value="5"></label><div class="formula" id="formula"></div><div class="result" id="result"></div><div class="note" id="note"></div></aside></section></main>
  <script>
    const canvas=document.querySelector("#canvas"),ctx=canvas.getContext("2d"),l=document.querySelector("#length"),b=document.querySelector("#breadth"),lt=document.querySelector("#lText"),bt=document.querySelector("#bText"),formula=document.querySelector("#formula"),result=document.querySelector("#result"),note=document.querySelector("#note");
    function render(){const length=Number(l.value),breadth=Number(b.value),scale=40,w=length*scale,h=breadth*scale,x=40,y=40;ctx.clearRect(0,0,720,540);ctx.fillStyle="#fbfaf7";ctx.fillRect(0,0,720,540);ctx.strokeStyle="#eadfce";for(let gx=0;gx<720;gx+=scale){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,540);ctx.stroke()}for(let gy=0;gy<540;gy+=scale){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(720,gy);ctx.stroke()}ctx.fillStyle="rgba(224,160,82,.5)";ctx.strokeStyle="#7a3e1d";ctx.lineWidth=5;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);ctx.fillStyle="#7a3e1d";ctx.font="bold 22px Segoe UI";ctx.textAlign="center";ctx.fillText(`${length} units`,x+w/2,y+h+34);ctx.save();ctx.translate(x-30,y+h/2);ctx.rotate(-Math.PI/2);ctx.fillText(`${breadth} units`,0,0);ctx.restore();lt.textContent=length;bt.textContent=breadth;formula.textContent="Area = length × breadth";result.textContent=`Area = ${length*breadth} square units  |  Perimeter = ${2*(length+breadth)} units`;note.textContent="Each small grid square is 1 × 1 unit. Count the small squares inside, then verify with multiplication. Perimeter is the distance around the outside."}
    l.oninput=render;b.oninput=render;document.querySelector("#random").onclick=()=>{l.value=2+Math.floor(Math.random()*13);b.value=2+Math.floor(Math.random()*9);render()};render();
  </script>
</body>
</html>
