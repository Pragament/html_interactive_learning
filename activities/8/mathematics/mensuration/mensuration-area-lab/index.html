<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensuration Area Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f4f1ea;
      color: #1e293b;
      min-height: 100vh;
      padding: 18px;
    }
    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    header, .panel {
      background: #fff;
      border: 1px solid #e2d7c7;
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(63, 44, 25, 0.08);
    }
    header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }
    header p { color: #756858; margin-top: 5px; }
    .main {
      display: grid;
      grid-template-columns: 1fr 0.9fr;
      gap: 16px;
    }
    .panel { padding: 18px; }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    button {
      border: 0;
      border-radius: 8px;
      min-height: 42px;
      padding: 0 14px;
      background: #e8ded0;
      color: #4c3c2a;
      font-weight: 850;
      cursor: pointer;
    }
    button.active {
      background: #9a5b30;
      color: #fff;
    }
    canvas {
      width: 100%;
      aspect-ratio: 1.2 / 1;
      background: #fbfaf7;
      border: 1px solid #eadfce;
      border-radius: 8px;
      display: block;
    }
    .controls {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 7px;
      font-weight: 800;
      color: #513f2c;
    }
    input[type="range"] { width: 100%; accent-color: #9a5b30; }
    .value {
      display: inline-block;
      min-width: 52px;
      text-align: center;
      padding: 2px 10px;
      background: #f1e8dc;
      border-radius: 999px;
      color: #7a3e1d;
    }
    .formula {
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      font-weight: 900;
      color: #7a3e1d;
      text-align: center;
      padding: 16px;
      border-radius: 8px;
      background: #fff7e8;
      border: 1px solid #ead4a9;
    }
    .result {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 900;
      text-align: center;
      color: #17613f;
    }
    .teacher-note {
      line-height: 1.5;
      background: #f7faf8;
      border-left: 5px solid #237a54;
      padding: 12px;
      border-radius: 8px;
      color: #48594f;
      font-weight: 650;
    }
    .hidden { display: none; }
    @media (max-width: 820px) {
      .main { grid-template-columns: 1fr; }
    }
  </style>
<script type="application/json" id="activity-metadata">
{
  "schemaVersion": 1,
  "id": "8-mathematics-mensuration-mensuration-area-lab",
  "order": 218,
  "class": "VIII",
  "subject": "Mathematics",
  "topic": "Mensuration",
  "subtopic": null,
  "title": "Mensuration Area Lab",
  "description": "Change dimensions of rectangles, parallelograms, trapeziums, and circles to connect shapes with area formulas.",
  "activityType": "exploration",
  "status": "active"
}
</script>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Mensuration Area Lab</h1>
        <p>Change dimensions and watch area formulas become visible.</p>
      </div>
      <button id="randomize">Random shape</button>
    </header>

    <section class="main">
      <div class="panel">
        <div class="tabs" role="tablist" aria-label="Shapes">
          <button class="active" data-shape="rectangle" type="button">Rectangle</button>
          <button data-shape="parallelogram" type="button">Parallelogram</button>
          <button data-shape="trapezium" type="button">Trapezium</button>
          <button data-shape="circle" type="button">Circle</button>
        </div>
        <canvas id="canvas" width="720" height="600"></canvas>
      </div>

      <aside class="panel controls">
        <label id="baseControl">
          Base / length: <span class="value" id="baseValue">6</span>
          <input id="base" type="range" min="2" max="10" step="1" value="6" />
        </label>
        <label id="heightControl">
          Height / breadth: <span class="value" id="heightValue">4</span>
          <input id="height" type="range" min="2" max="8" step="1" value="4" />
        </label>
        <label id="topControl" class="hidden">
          Top parallel side: <span class="value" id="topValue">4</span>
          <input id="top" type="range" min="1" max="9" step="1" value="4" />
        </label>
        <label id="radiusControl" class="hidden">
          Radius: <span class="value" id="radiusValue">4</span>
          <input id="radius" type="range" min="2" max="8" step="1" value="4" />
        </label>
        <div class="formula" id="formula"></div>
        <div class="result" id="result"></div>
        <div class="teacher-note" id="note"></div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");
    const shapeButtons = [...document.querySelectorAll("[data-shape]")];
    const inputs = {
      base: document.querySelector("#base"),
      height: document.querySelector("#height"),
      top: document.querySelector("#top"),
      radius: document.querySelector("#radius")
    };
    const values = {
      base: document.querySelector("#baseValue"),
      height: document.querySelector("#heightValue"),
      top: document.querySelector("#topValue"),
      radius: document.querySelector("#radiusValue")
    };
    const controls = {
      base: document.querySelector("#baseControl"),
      height: document.querySelector("#heightControl"),
      top: document.querySelector("#topControl"),
      radius: document.querySelector("#radiusControl")
    };
    const formula = document.querySelector("#formula");
    const result = document.querySelector("#result");
    const note = document.querySelector("#note");

    let shape = "rectangle";

    function num(id) { return Number(inputs[id].value); }

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fbfaf7";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#eadfce";
      ctx.lineWidth = 1;
      for (let x = 60; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 40; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
    }

    function label(text, x, y, color = "#1e293b") {
      ctx.fillStyle = color;
      ctx.font = "bold 22px Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text, x, y);
    }

    function drawShape() {
      drawGrid();
      const scale = 38;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2 + 34;
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#7a3e1d";
      ctx.fillStyle = "rgba(224, 160, 82, 0.45)";

      if (shape === "circle") {
        const r = num("radius") * scale * 0.55;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx, cy); ctx.lineTo(cx + r, cy);
        ctx.strokeStyle = "#237a54"; ctx.stroke();
        label(`r = ${num("radius")}`, cx + r / 2, cy - 12, "#237a54");
        return;
      }

      const base = num("base") * scale;
      const height = num("height") * scale;
      const x0 = cx - base / 2;
      const y0 = cy + height / 2;

      ctx.beginPath();
      if (shape === "rectangle") {
        ctx.rect(x0, y0 - height, base, height);
        ctx.fill(); ctx.stroke();
      } else if (shape === "parallelogram") {
        const skew = 70;
        ctx.moveTo(x0 + skew, y0 - height);
        ctx.lineTo(x0 + skew + base, y0 - height);
        ctx.lineTo(x0 + base, y0);
        ctx.lineTo(x0, y0);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.setLineDash([8, 8]);
        ctx.strokeStyle = "#237a54";
        ctx.beginPath(); ctx.moveTo(x0 + skew, y0 - height); ctx.lineTo(x0 + skew, y0); ctx.stroke();
        ctx.setLineDash([]);
      } else {
        const top = num("top") * scale;
        ctx.moveTo(cx - top / 2, y0 - height);
        ctx.lineTo(cx + top / 2, y0 - height);
        ctx.lineTo(x0 + base, y0);
        ctx.lineTo(x0, y0);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        label(`top = ${num("top")}`, cx, y0 - height - 18, "#7a3e1d");
      }

      label(`base = ${num("base")}`, cx, y0 + 34, "#7a3e1d");
      label(`height = ${num("height")}`, x0 - 58, y0 - height / 2, "#237a54");
    }

    function render() {
      Object.keys(values).forEach((key) => values[key].textContent = inputs[key].value);
      controls.top.classList.toggle("hidden", shape !== "trapezium");
      controls.radius.classList.toggle("hidden", shape !== "circle");
      controls.base.classList.toggle("hidden", shape === "circle");
      controls.height.classList.toggle("hidden", shape === "circle");

      let area = 0;
      if (shape === "rectangle") {
        area = num("base") * num("height");
        formula.textContent = "Area = length × breadth";
        note.textContent = "Teacher prompt: ask learners to count grid squares, then compare with multiplication.";
      } else if (shape === "parallelogram") {
        area = num("base") * num("height");
        formula.textContent = "Area = base × height";
        note.textContent = "Slide the slanted part mentally to form a rectangle with the same base and height.";
      } else if (shape === "trapezium") {
        area = 0.5 * (num("base") + num("top")) * num("height");
        formula.textContent = "Area = 1/2 × (a + b) × h";
        note.textContent = "Pair two identical trapeziums to make a parallelogram.";
      } else {
        area = Math.PI * num("radius") * num("radius");
        formula.textContent = "Area = πr²";
        note.textContent = "Cut a circle into sectors and rearrange them to see a near-rectangle.";
      }
      result.textContent = `Area ≈ ${area.toFixed(2)} square units`;
      drawShape();
    }

    shapeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        shape = button.dataset.shape;
        shapeButtons.forEach((item) => item.classList.toggle("active", item === button));
        render();
      });
    });
    Object.values(inputs).forEach((input) => input.addEventListener("input", render));
    document.querySelector("#randomize").addEventListener("click", () => {
      shape = ["rectangle", "parallelogram", "trapezium", "circle"][Math.floor(Math.random() * 4)];
      shapeButtons.forEach((item) => item.classList.toggle("active", item.dataset.shape === shape));
      Object.values(inputs).forEach((input) => input.value = Number(input.min) + Math.floor(Math.random() * (Number(input.max) - Number(input.min) + 1)));
      render();
    });

    render();
  </script>
</body>
</html>
