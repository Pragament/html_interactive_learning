<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Powers and Exponents Pattern Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f2f5f1;
      color: #172033;
      min-height: 100vh;
      padding: 18px;
    }
    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    header, .panel {
      background: #fff;
      border: 1px solid #dae4d8;
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(31, 54, 42, 0.08);
    }
    header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); }
    header p { color: #637466; margin-top: 5px; }
    .grid {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 16px;
    }
    .panel { padding: 18px; }
    .controls { display: grid; gap: 16px; }
    label {
      display: grid;
      gap: 8px;
      font-weight: 800;
      color: #30453a;
    }
    input[type="range"] { width: 100%; accent-color: #237a54; }
    .value {
      display: inline-block;
      min-width: 44px;
      text-align: center;
      padding: 2px 10px;
      background: #e9f4ee;
      border-radius: 999px;
      color: #17613f;
    }
    .expression {
      font-size: clamp(2.2rem, 8vw, 5rem);
      font-weight: 900;
      text-align: center;
      color: #17613f;
      padding: 20px;
      border-radius: 8px;
      background: #eaf7ef;
      border: 1px solid #cde8d7;
    }
    .result {
      text-align: center;
      font-size: clamp(1.6rem, 5vw, 3rem);
      font-weight: 900;
      color: #7a3e1d;
      padding: 14px;
    }
    .multiplication {
      line-height: 1.6;
      padding: 14px;
      border-radius: 8px;
      background: #fff8e9;
      border: 1px solid #efdcae;
      font-weight: 750;
      overflow-wrap: anywhere;
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 8px;
      margin-top: 14px;
      max-height: 330px;
      overflow: auto;
      padding: 4px;
    }
    .tile {
      min-height: 36px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #237a54, #5fb584);
      color: #fff;
      font-weight: 900;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.16);
    }
    .compare {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }
    .compare-card {
      border-radius: 8px;
      padding: 12px;
      background: #f6faf7;
      border: 1px solid #dce9df;
      text-align: center;
      font-weight: 850;
    }
    .sign {
      font-size: 2rem;
      font-weight: 900;
      color: #c84b31;
    }
    button {
      border: 0;
      border-radius: 8px;
      min-height: 42px;
      padding: 0 14px;
      background: #237a54;
      color: #fff;
      font-weight: 850;
      cursor: pointer;
    }
    .note {
      color: #52665b;
      line-height: 1.5;
      background: #f7faf8;
      border-left: 5px solid #237a54;
      padding: 12px;
      border-radius: 8px;
    }
    @media (max-width: 820px) {
      .grid, .compare { grid-template-columns: 1fr; }
      .sign { text-align: center; }
    }
  </style>
<script type="application/json" id="activity-metadata">
{
  "schemaVersion": 1,
  "id": "8-mathematics-exponents-and-powers-powers-pattern-lab",
  "order": 217,
  "class": "VIII",
  "subject": "Mathematics",
  "topic": "Exponents and Powers",
  "subtopic": null,
  "title": "Powers and Exponents Pattern Lab",
  "description": "Build powers with base and exponent sliders, expand repeated multiplication, and compare growth patterns.",
  "activityType": "exploration",
  "status": "active"
}
</script>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Powers and Exponents Pattern Lab</h1>
        <p>Build a power, expand it, and compare growth with another power.</p>
      </div>
      <button id="challenge">New challenge</button>
    </header>

    <section class="grid">
      <aside class="panel controls">
        <label>
          Base: <span class="value" id="baseValue">2</span>
          <input id="base" type="range" min="2" max="9" step="1" value="2" />
        </label>
        <label>
          Exponent: <span class="value" id="expValue">3</span>
          <input id="exponent" type="range" min="1" max="6" step="1" value="3" />
        </label>
        <div class="note" id="teacherPrompt"></div>
      </aside>

      <section class="panel">
        <div class="expression" id="expression"></div>
        <div class="result" id="result"></div>
        <div class="multiplication" id="expanded"></div>
        <div class="tiles" id="tiles" aria-label="unit tiles"></div>
      </section>
    </section>

    <section class="panel">
      <h2>Growth Compare</h2>
      <div class="compare">
        <div class="compare-card" id="leftPower"></div>
        <div class="sign" id="compareSign"></div>
        <div class="compare-card" id="rightPower"></div>
      </div>
    </section>
  </main>

  <script>
    const baseInput = document.querySelector("#base");
    const expInput = document.querySelector("#exponent");
    const baseValue = document.querySelector("#baseValue");
    const expValue = document.querySelector("#expValue");
    const expression = document.querySelector("#expression");
    const result = document.querySelector("#result");
    const expanded = document.querySelector("#expanded");
    const tiles = document.querySelector("#tiles");
    const teacherPrompt = document.querySelector("#teacherPrompt");
    const leftPower = document.querySelector("#leftPower");
    const rightPower = document.querySelector("#rightPower");
    const compareSign = document.querySelector("#compareSign");

    const prompts = [
      "Ask students: which matters more here, increasing the base or increasing the exponent?",
      "Prediction pause: estimate the answer before looking at the tiles.",
      "Discuss why repeated addition is not the same as repeated multiplication.",
      "Find two different powers that are close in value."
    ];

    function power(base, exponent) {
      return Math.pow(base, exponent);
    }

    function renderTiles(value) {
      tiles.innerHTML = "";
      const shown = Math.min(value, 180);
      for (let i = 1; i <= shown; i += 1) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.textContent = i <= 36 ? i : "";
        tiles.append(tile);
      }
      if (value > shown) {
        const extra = document.createElement("div");
        extra.className = "tile";
        extra.textContent = `+${value - shown}`;
        tiles.append(extra);
      }
    }

    function renderCompare(base, exponent) {
      const otherBase = Math.max(2, base - 1);
      const otherExponent = exponent + 1;
      const left = power(base, exponent);
      const right = power(otherBase, otherExponent);
      leftPower.textContent = `${base}^${exponent} = ${left}`;
      rightPower.textContent = `${otherBase}^${otherExponent} = ${right}`;
      compareSign.textContent = left === right ? "=" : left > right ? ">" : "<";
    }

    function render() {
      const base = Number(baseInput.value);
      const exponent = Number(expInput.value);
      const value = power(base, exponent);
      baseValue.textContent = base;
      expValue.textContent = exponent;
      expression.innerHTML = `${base}<sup>${exponent}</sup>`;
      result.textContent = value.toLocaleString();
      expanded.textContent = `${base} multiplied ${exponent} time${exponent === 1 ? "" : "s"}: ${Array.from({ length: exponent }, () => base).join(" × ")} = ${value}`;
      teacherPrompt.textContent = prompts[(base + exponent) % prompts.length];
      renderTiles(value);
      renderCompare(base, exponent);
    }

    baseInput.addEventListener("input", render);
    expInput.addEventListener("input", render);
    document.querySelector("#challenge").addEventListener("click", () => {
      baseInput.value = 2 + Math.floor(Math.random() * 8);
      expInput.value = 1 + Math.floor(Math.random() * 6);
      render();
    });

    render();
  </script>
</body>
</html>
