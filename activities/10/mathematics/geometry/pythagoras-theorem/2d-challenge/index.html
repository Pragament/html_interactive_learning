<div class="app">

                </div>

<script>
    (function() {
        // ─── DOM refs ───
        const canvas = document.getElementById('triangleCanvas');
        const ctx = canvas.getContext('2d');
        const sliderA = document.getElementById('sliderA');
        const sliderB = document.getElementById('sliderB');
        const numberA = document.getElementById('numberA');
        const numberB = document.getElementById('numberB');
        const valA = document.getElementById('valA');
        const valB = document.getElementById('valB');
        const a2display = document.getElementById('a2display');
        const b2display = document.getElementById('b2display');
        const sumDisplay = document.getElementById('sumDisplay');
        const cDisplay = document.getElementById('cDisplay');
        const revealAnswer = document.getElementById('revealAnswer');

        // Guess inputs & feedbacks
        const guessInputs = {
            1: document.getElementById('guess1'),
            2: document.getElementById('guess2'),
            3: document.getElementById('guess3')
        };
        const feedbacks = {
            1: document.getElementById('feedback1'),
            2: document.getElementById('feedback2'),
            3: document.getElementById('feedback3')
        };

        // ─── State ───
        let a = 3.0, b = 4.0, c = 5.0;
        let revealed = false;  // whether the answer has been revealed

        // ─── Helpers ───
        function round2(v) { return Math.round(v * 100) / 100; }
        function clampSide(v) {
            const min = 0.5;
            const max = 100;
            return Math.min(max, Math.max(min, v));
        }

        function clearRevealAfterSideChange() {
            if (!revealed) return;
            revealed = false;
            Object.values(feedbacks).forEach(f => { f.textContent = ''; f.className = 'feedback'; });
        }

        function setSide(side, value) {
            if (!Number.isFinite(value)) {
                updateAll();
                return;
            }
            const next = clampSide(value);
            if (side === 'A') {
                sliderA.value = String(next);
                numberA.value = String(next);
            } else {
                sliderB.value = String(next);
                numberB.value = String(next);
            }
            clearRevealAfterSideChange();
            updateAll();
        }

        function updateC() {
            c = Math.sqrt(a * a + b * b);
            return c;
        }

        // ─── Draw triangle (c label shows "?" unless revealed) ───
        function drawTriangle() {
            const w = canvas.width, h = canvas.height;
            const pad = 60;
            ctx.clearRect(0, 0, w, h);

            // Grid
            ctx.save();
            ctx.strokeStyle = '#eaf1f7';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 10; i++) {
                const x = pad + (i / 10) * (w - 2 * pad);
                ctx.beginPath();
                ctx.moveTo(x, pad);
                ctx.lineTo(x, h - pad);
                ctx.stroke();
                const y = pad + (i / 10) * (h - 2 * pad);
                ctx.beginPath();
                ctx.moveTo(pad, y);
                ctx.lineTo(w - pad, y);
                ctx.stroke();
            }
            ctx.restore();

            const maxSide = Math.max(a, b, c);
            const avail = Math.min(w, h) - 2 * pad;
            const scale = (avail * 0.85) / maxSide;

            const originX = pad + 20;
            const originY = h - pad - 20;
            const ax = originX, ay = originY - a * scale;
            const bx = originX + b * scale, by = originY;

            // Sides
            ctx.save();
            // a
            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.lineTo(ax, ay);
            ctx.strokeStyle = '#d45c4c';
            ctx.lineWidth = 4;
            ctx.stroke();
            // b
            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.lineTo(bx, by);
            ctx.strokeStyle = '#4a8c6f';
            ctx.lineWidth = 4;
            ctx.stroke();
            // c
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(bx, by);
            ctx.strokeStyle = '#3a7bb5';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Right angle marker
            const rSize = 18;
            ctx.strokeStyle = '#1a4052';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(originX + rSize, originY);
            ctx.lineTo(originX + rSize, originY - rSize);
            ctx.lineTo(originX, originY - rSize);
            ctx.stroke();

            // Labels
            ctx.font = 'bold 22px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#d45c4c';
            ctx.fillText('a', originX - 36, (originY + ay) / 2);
            ctx.fillStyle = '#4a8c6f';
            ctx.fillText('b', (originX + bx) / 2, originY + 36);
            // c label: show "c = ?" or the actual value if revealed
            ctx.fillStyle = '#3a7bb5';
            const cLabel = revealed ? `c = ${c.toFixed(2)}` : 'c = ?';
            ctx.fillText(cLabel, (ax + bx) / 2 + 24, (ay + by) / 2 - 18);

            // Dots
            const vertices = [[originX, originY, '#1a4052'], [ax, ay, '#d45c4c'], [bx, by, '#4a8c6f']];
            vertices.forEach(([x, y, color]) => {
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // 90° arc
            ctx.beginPath();
            ctx.arc(originX, originY, 22, 0, Math.PI / 2);
            ctx.strokeStyle = '#1a4052';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.font = '15px "Segoe UI", sans-serif';
            ctx.fillStyle = '#1a4052';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText('90°', originX + 8, originY - 6);

            // Side lengths on canvas (a and b only)
            ctx.font = '15px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillStyle = '#d45c4c';
            ctx.fillText(a.toFixed(1), originX - 36, (originY + ay) / 2 - 10);
            ctx.fillStyle = '#4a8c6f';
            ctx.fillText(b.toFixed(1), (originX + bx) / 2, originY + 24);
            // Do NOT display c length on canvas (it's either "?" or shown in label above)
            ctx.restore();
        }

        // ─── Update UI (formula box, sliders, canvas) ───
        function updateAll() {
            a = parseFloat(sliderA.value);
            b = parseFloat(sliderB.value);
            updateC();

            valA.textContent = a.toFixed(1);
            valB.textContent = b.toFixed(1);
            numberA.value = a.toFixed(1);
            numberB.value = b.toFixed(1);

            const a2 = a * a, b2 = b * b, sum = a2 + b2;
            a2display.textContent = a2.toFixed(2);
            b2display.textContent = b2.toFixed(2);
            sumDisplay.textContent = sum.toFixed(2);

            // c display: show "?" unless revealed
            if (!revealed) {
                cDisplay.textContent = '?';
                cDisplay.className = 'unknown';
            } else {
                cDisplay.textContent = c.toFixed(2);
                cDisplay.className = ''; // remove unknown style
            }

            // Reset reveal answer display if not revealed
            if (!revealed) {
                revealAnswer.textContent = '?';
            } else {
                revealAnswer.textContent = c.toFixed(2);
            }

            drawTriangle();
        }

        // ─── Check a guess ───
        function checkGuess(studentId) {
            const input = guessInputs[studentId];
            const feedback = feedbacks[studentId];
            const guess = parseFloat(input.value);
            if (isNaN(guess) || guess <= 0) {
                feedback.textContent = '⚠️ Enter a positive number';
                feedback.className = 'feedback wrong';
                return;
            }
            const correct = round2(c);
            const diff = Math.abs(guess - correct);
            let msg, cls;
            if (diff < 0.005) {
                msg = `✅ Perfect! c = ${correct.toFixed(2)}`;
                cls = 'correct';
            } else if (diff < 0.2) {
                msg = `🟡 Close! c = ${correct.toFixed(2)} (off by ${diff.toFixed(2)})`;
                cls = 'close';
            } else {
                msg = `❌ Not quite. c = ${correct.toFixed(2)} (you entered ${guess.toFixed(2)})`;
                cls = 'wrong';
            }
            feedback.textContent = msg;
            feedback.className = `feedback ${cls}`;
        }

        // ─── Reveal answer ───
        function revealAnswerFunc() {
            revealed = true;
            cDisplay.textContent = c.toFixed(2);
            cDisplay.className = '';
            revealAnswer.textContent = c.toFixed(2);
            drawTriangle(); // redraw to show c value on canvas
        }

        // ─── Event listeners ───
        sliderA.addEventListener('input', function() {
            setSide('A', parseFloat(this.value));
        });
        sliderB.addEventListener('input', function() {
            setSide('B', parseFloat(this.value));
        });
        numberA.addEventListener('change', function() {
            setSide('A', parseFloat(this.value));
        });
        numberB.addEventListener('change', function() {
            setSide('B', parseFloat(this.value));
        });
        numberA.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') setSide('A', parseFloat(this.value));
        });
        numberB.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') setSide('B', parseFloat(this.value));
        });
        document.querySelectorAll('.step-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const slider = this.dataset.target === 'A' ? sliderA : sliderB;
                setSide(this.dataset.target, parseFloat(slider.value) + parseFloat(this.dataset.step));
            });
        });

        document.querySelectorAll('.check-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const student = parseInt(this.dataset.student);
                checkGuess(student);
            });
        });

        // Enter key on inputs
        Object.keys(guessInputs).forEach(id => {
            guessInputs[id].addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    checkGuess(parseInt(this.id.slice(-1)));
                }
            });
        });

        document.getElementById('revealBtn').addEventListener('click', revealAnswerFunc);

        // ─── Click on canvas to randomize (fun) ───
        canvas.addEventListener('click', function() {
            if (revealed) {
                revealed = false;
                Object.values(feedbacks).forEach(f => { f.textContent = ''; f.className = 'feedback'; });
            }
            const newA = round2(0.5 + Math.random() * 7);
            const newB = round2(0.5 + Math.random() * 7);
            sliderA.value = newA;
            sliderB.value = newB;
            numberA.value = newA;
            numberB.value = newB;
            updateAll();
        });

        // ─── Init ───
        updateAll();
    })();
</script>
<script id="topic-preset-script">
/* Topic presets use reusable mathematical values, never question identifiers. */
(() => {
  'use strict';
  const schema = {"leg_a": {"label": "Leg a", "default": 3, "min": 0.5, "max": 100, "integer": false}, "leg_b": {"label": "Leg b", "default": 4, "min": 0.5, "max": 100, "integer": false}, "hypotenuse": {"label": "Hypotenuse to check", "default": 5, "min": 0.5, "max": 150, "integer": false}, "focus": {"label": "Explore", "default": "hypotenuse", "options": ["hypotenuse", "missing-leg", "check", "proof"]}};
  const params = new URLSearchParams(location.search);
  if (!Object.keys(schema).some(key => params.has(key))) return;
  const state = {}, invalid = [];
  for (const [key, spec] of Object.entries(schema)) {
    const raw = params.get(key);
    let value = spec.default;
    if (raw !== null) {
      if (spec.options) { if (spec.options.includes(raw)) value = raw; else invalid.push(key); }
      else if (spec.type === 'text') { if (raw.length <= 180 && spec.pattern.test(raw)) value = raw; else invalid.push(key); }
      else { const number = Number(raw); if (raw.trim() && Number.isFinite(number) && number >= spec.min && number <= spec.max && (!spec.integer || Number.isInteger(number))) value = number; else invalid.push(key); }
    }
    state[key] = value;
  }
  const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const fmt = value => Number.isFinite(value) ? String(Number(value.toFixed(6))) : 'undefined';
  const gcd = (a,b) => b ? gcd(b,a%b) : a;
  const fraction = value => { for(let d=1;d<=144;d++){const n=Math.round(value*d);if(Math.abs(n/d-value)<1e-8)return d===1?String(n):`${n}/${d}`;}return fmt(value); };
  const svg = body => `<svg viewBox="0 0 600 280" role="img" aria-label="${esc(title)} diagram">${body}</svg>`;
  const line = (x1,y1,x2,y2,color='#2563eb',dash='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="3" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
  const text = (x,y,value,color='#172033') => `<text x="${x}" y="${y}" fill="${color}" font-size="18" text-anchor="middle">${esc(value)}</text>`;
  const polygon = (points,color='#2563eb') => `<polygon points="${points}" fill="${color}18" stroke="${color}" stroke-width="3"/>`;
  const note = (heading,body) => `<h3>${esc(heading)}</h3><p>${body}</p>`;
  const factors = n => { const out=[]; for(let i=1;i<=Math.sqrt(n);i++)if(n%i===0){out.push(i);if(i*i!==n)out.push(n/i);}return out.sort((a,b)=>a-b); };
  const primes = n => {const out=[];for(let p=2;p*p<=n;p++)while(n%p===0){out.push(p);n/=p;}if(n>1)out.push(n);return out;};
  const setInput = (id,value,event='input') => {const el=document.getElementById(id);if(!el)return;if(el.type==='range'){el.min=Math.min(Number(el.min),value);el.max=Math.max(Number(el.max),value);el.step='any';}el.value=value;el.dispatchEvent(new Event(event,{bubbles:true}));};
  const title = "Explore the Pythagorean theorem";

  function render(s){if(s.focus==='missing-leg'&&s.hypotenuse>s.leg_a)s={...s,leg_b:Math.sqrt(s.hypotenuse*s.hypotenuse-s.leg_a*s.leg_a)};const a=s.leg_a,b=s.leg_b,c=Math.hypot(a,b),k=150/Math.max(a,b),x=150,y=220;
    let picture=polygon(`${x},${y} ${x+b*k},${y} ${x},${y-a*k}`)+`<path d="M${x+12} ${y}v-12h-12" fill="none" stroke="#172033"/>`+text(x-30,y-a*k/2,`a=${fmt(a)}`,'#db2777')+text(x+b*k/2,y+28,`b=${fmt(b)}`,'#059669')+text(x+b*k/2+32,y-a*k/2-15,`c=${fmt(c)}`)+text(410,65,`a² = ${fmt(a*a)}`,'#db2777')+text(410,100,`b² = ${fmt(b*b)}`,'#059669')+text(410,135,`c² = ${fmt(c*c)}`);
    let result=svg(picture)+note('The squares of the side lengths',`<span class="preset-equation">a² + b² = c²<br>${fmt(a*a)} + ${fmt(b*b)} = ${fmt(c*c)} → c = ${fmt(c)}</span><br>c is always the side opposite the 90° angle.`);
    if(s.focus==='missing-leg')result+=note('Find the missing leg',s.hypotenuse>s.leg_a?`b = √(c² − a²) = √(${fmt(s.hypotenuse*s.hypotenuse)} − ${fmt(a*a)}) = ${fmt(Math.sqrt(s.hypotenuse*s.hypotenuse-a*a))}. Subtract the known leg’s square, then take the square root.`:'The hypotenuse must be longer than either leg.');
    if(s.focus==='check')result+=note('Test the proposed side lengths',`Compare ${fmt(a*a+b*b)} with ${fmt(s.hypotenuse*s.hypotenuse)}. ${Math.abs(a*a+b*b-s.hypotenuse*s.hypotenuse)<1e-8?'Equal: these lengths form a right triangle.':'Unequal: these three lengths cannot form a right triangle with this hypotenuse. The blue triangle above uses the actual required hypotenuse.'}`);
    if(s.focus==='proof'){const altitude=a*b/c,m=a*a/c,n=b*b/c,fx=x+a*a*b*k/(c*c),fy=y-a*b*b*k/(c*c);result+=svg(polygon(`${x},${y} ${x+b*k},${y} ${x},${y-a*k}`)+line(x,y,fx,fy,'#db2777','6 4')+text(410,100,`m = ${fmt(m)}; n = ${fmt(n)}`)+text(410,140,`Altitude = ${fmt(altitude)}`)+text(300,270,'The altitude divides the right triangle into two similar triangles.'))+note('Proof by similar triangles',`Draw the altitude to the hypotenuse, splitting c into m and n. Similarity gives a² = cm and b² = cn. Add them: a² + b² = c(m + n) = c × c = c².`);}
    return result;
  }
  function sync(s){if(s.focus==='missing-leg'&&s.hypotenuse>s.leg_a)s={...s,leg_b:Math.sqrt(s.hypotenuse*s.hypotenuse-s.leg_a*s.leg_a)};setInput('sliderA',s.leg_a);setInput('sliderB',s.leg_b);}

  function mount() {
    document.body.classList.add('topic-preset-open');
    const style=document.createElement('style');style.textContent=`body.topic-preset-open{flex-direction:column}#topic-preset{box-sizing:border-box;max-width:1200px;width:calc(100% - 24px);margin:18px auto;padding:20px;border:2px solid #2563eb;border-radius:16px;background:#f8fafc;color:#172033;font:16px/1.5 system-ui,sans-serif;text-align:left}#topic-preset h2{margin:0 0 6px;font-size:24px;color:#172033}#topic-preset h3{margin:16px 0 6px;font-size:19px;color:#172033}#topic-preset p{margin:8px 0;color:#172033}#topic-preset .preset-controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}#topic-preset label{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0;font-size:14px;color:#172033}#topic-preset input,#topic-preset select{box-sizing:border-box;width:100%;padding:8px;border:1px solid #64748b;border-radius:6px;background:white;color:#172033;font:inherit;min-width:0}#topic-preset svg{display:block;width:100%;max-height:340px;background:white;border-radius:8px}#topic-preset .preset-result{overflow-wrap:anywhere}#topic-preset .preset-equation{font-size:20px;font-weight:700;color:#174aa0}#topic-preset a{color:#174aa0;text-decoration:underline}#topic-preset .preset-error{color:#9f1239}#topic-preset .preset-tiles{display:flex;flex-wrap:wrap;gap:8px}#topic-preset .preset-tile{background:#dbeafe;border-radius:8px;padding:6px 12px}#topic-preset table{width:100%;border-collapse:collapse;font-size:15px}#topic-preset th,#topic-preset td{border:1px solid #cbd5e1;padding:6px;text-align:center;color:#172033}#topic-preset .preset-scroll{overflow-x:auto} @media(max-width:480px){#topic-preset{padding:12px}#topic-preset .preset-equation{font-size:17px}}`;
    document.head.append(style);
    const section=document.createElement('section');section.id='topic-preset';section.setAttribute('aria-label','Explore the URL setup');
    section.innerHTML=`<h2>${esc(title)}</h2><p>Change the values to explore this topic. The link below shares the current setup.</p>${invalid.length?`<p class="preset-error">Invalid URL values for ${esc(invalid.join(', '))}; using the defaults shown below.</p>`:''}<form class="preset-controls"></form><div class="preset-result" aria-live="polite"></div><p><a class="preset-share">Open or copy this setup</a></p>`;
    document.body.insertBefore(section,document.body.firstChild);
    const form=section.querySelector('form');const more=document.createElement('details');more.innerHTML='<summary>More exploration settings</summary>';const extra=document.createElement('div');extra.className='preset-controls';more.append(extra);section.insertBefore(more,section.querySelector('.preset-result'));form.addEventListener('submit',event=>event.preventDefault());
    for(const [key,spec] of Object.entries(schema)){
      const label=document.createElement('label');label.textContent=spec.label;
      const input=document.createElement(spec.options?'select':'input');input.name=key;input.id='preset-'+key;
      if(spec.options)for(const value of spec.options){const option=document.createElement('option');option.value=value;option.textContent=value.replaceAll('-',' ');input.append(option);}
      else {input.type=spec.type==='text'?'text':'number';if(input.type==='number'){input.min=spec.min;input.max=spec.max;input.step=spec.integer?'1':'any';}}
      input.value=state[key];label.append(input);(params.has(key)?form:extra).append(label);
      input.addEventListener('change',()=>{const value=input.type==='number'?Number(input.value):input.value;const valid=spec.options?spec.options.includes(value):spec.type==='text'?value.length<=180&&spec.pattern.test(value):input.value.trim()&&Number.isFinite(value)&&value>=spec.min&&value<=spec.max&&(!spec.integer||Number.isInteger(value));if(!valid){input.value=state[key];return;}state[key]=value;refresh();});
    }
    function refresh(){const result=section.querySelector('.preset-result');result.innerHTML=render(state);const url=new URL(location.href);for(const key of Object.keys(schema))url.searchParams.set(key,state[key]);section.querySelector('.preset-share').href=url.href;sync(state);}
    refresh();
  }
  if(document.readyState==='complete')mount();else window.addEventListener('load',mount,{once:true});
})();
