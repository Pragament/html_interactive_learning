<body>
<main id="app" tabindex="-1"></main>
<footer class="foot">Your progress is saved in this browser on this device only. Use 5 V USB power only. Ask a teacher to check your circuit.</footer>
<noscript><p style="padding:2rem">Please turn on JavaScript to use the Electronics Lab.</p></noscript>
<script>
'use strict';
/* ===== helpers & storage (localStorage only, no accounts) ===== */
const APP=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem('swct:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('swct:'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('swct:'+k)}catch(e){}}
};
let P=store.get('progress',{});
const mp=id=>P['m'+id]||(P['m'+id]={seen:[],acts:{},quiz:null,steps:{},built:{}});
const save=()=>store.set('progress',P);
const getGroup=()=>store.get('group','A');
const unlockAll=()=>store.get('unlockAll',false);
const allSeen=m=>m.sections.every((_,i)=>mp(m.id).seen.includes(i));
const mandatoryDone=m=>m.projects.length===0||m.projects.some(p=>p.mandatory&&mp(m.id).built[p.id]);
const isDone=m=>!!(mp(m.id).quiz&&mp(m.id).quiz.passed)&&mandatoryDone(m);
const isUnlocked=id=>true;
function learnPct(m){const p=mp(m.id);const parts=m.sections.length+1+(m.projects.length?1:0);
  let n=p.seen.length+(p.quiz&&p.quiz.passed?1:0)+(m.projects.length&&mandatoryDone(m)?1:0);return Math.round(100*n/parts)}
const go=h=>{location.hash=h};
const percent=n=>`<div class="bar" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="100"><i style="width:${n}%"></i></div>`;

/* ===== widgets: tiny interactive components ===== */
const WG={};let wn=0;const pending=[];
function widget(def){const id='w'+(++wn);WG[id]={d:def,s:JSON.parse(JSON.stringify(def.state||{}))};pending.push(id);return `<div class="widget" id="${id}"></div>`}
function wr(id){const w=WG[id],el=document.getElementById(id);if(el)el.innerHTML=w.d.render(w.s,id)}
function wa(id,k,v){const w=WG[id];w.d.act(w.s,k,v);wr(id)}
function mountAll(){while(pending.length)wr(pending.shift())}
const btn=(id,k,label,cls='',v='')=>`<button class="${cls}" onclick="wa('${id}','${k}',${JSON.stringify(v).replace(/"/g,'&quot;')})">${label}</button>`;

/* ===== media with honest placeholders ===== */
function media(kind,file,desc){
  const src=`assets/${kind==='video'?'video':'img'}/${file}`;
  const tag=kind==='video'?`<video controls preload="none" src="${src}" onerror="phShow(this)"></video>`:`<img src="${src}" alt="${esc(desc)}" onerror="phShow(this)">`;
  return `<figure class="media">${tag}<div class="ph" hidden><b>PLACEHOLDER – ${kind.toUpperCase()} NOT ADDED YET</b><span>Needed: ${esc(desc)}</span><code>${src}</code></div></figure>`}
function phShow(el){el.hidden=true;el.nextElementSibling.hidden=false}

/* ===== read aloud (browser voice) ===== */
function speak(text){if(!('speechSynthesis' in window)){alert('Read aloud is not supported in this browser.');return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.9;speechSynthesis.speak(u)}

/* ===== circuit drawing (accurate symbols, animated current) ===== */
let cn=0;
function circuit(o={}){
  const id='c'+(++cn);
  o=Object.assign({src:true,wire:'good',gap:'switch',closed:true,load:'led',noLoad:false,color:'#ff4d4d',labels:false,glow:null,mat:null,trace:null},o);
  const res=o.res!==undefined?o.res:o.load==='led';
  const flow=!!(o.src&&!o.noLoad&&o.wire==='good'&&(o.gap==='none'||(o.gap==='switch'&&o.closed)||(o.gap==='material'&&o.mat&&o.mat.c)));
  const lit=flow?(o.glow==null?1:o.glow):0;
  const K='#12263f',W='#c97b2a';let s=`<path id="${id}" d="M60,40 H340 V180 H60 Z" fill="none" stroke="${W}" stroke-width="5" stroke-linejoin="round"/>`;
  // power source
  if(o.src){s+=`<rect x="38" y="78" width="44" height="66" fill="#fff"/><line x1="60" y1="78" x2="60" y2="96" stroke="${K}" stroke-width="4"/><line x1="60" y1="118" x2="60" y2="144" stroke="${K}" stroke-width="4"/><line x1="40" y1="96" x2="80" y2="96" stroke="${K}" stroke-width="5"/><line x1="49" y1="118" x2="71" y2="118" stroke="${K}" stroke-width="9"/><text x="22" y="100" font-size="20" font-weight="700" fill="${K}">+</text><text x="26" y="132" font-size="22" font-weight="700" fill="${K}">−</text>`}
  else s+=`<rect x="38" y="78" width="44" height="66" fill="#fff" stroke="#999" stroke-dasharray="5"/><text x="60" y="118" font-size="22" text-anchor="middle" fill="#999">?</text>`;
  // resistor
  if(res)s+=`<rect x="155" y="25" width="70" height="30" fill="#fff"/><polyline points="155,40 170,40 175,28 185,52 195,28 205,52 210,40 225,40" fill="none" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/>`;
  // load
  s+=`<rect x="316" y="76" width="48" height="68" fill="#fff"/>`;
  if(o.noLoad)s+=`<rect x="318" y="80" width="44" height="60" fill="#fff" stroke="#999" stroke-dasharray="5"/><text x="340" y="118" font-size="22" text-anchor="middle" fill="#999">?</text>`;
  else if(o.load==='led')s+=`<circle cx="340" cy="108" r="36" fill="${o.color}" opacity="${(.5*lit).toFixed(2)}"/><line x1="340" y1="76" x2="340" y2="95" stroke="${K}" stroke-width="4"/><line x1="340" y1="125" x2="340" y2="144" stroke="${K}" stroke-width="4"/><polygon points="323,95 357,95 340,122" fill="${lit?o.color:'#fff'}" stroke="${K}" stroke-width="3.5" stroke-linejoin="round"/><line x1="323" y1="125" x2="357" y2="125" stroke="${K}" stroke-width="4.5"/>`;
  else s+=`<circle cx="340" cy="110" r="40" fill="#ffd23f" opacity="${(.55*lit).toFixed(2)}"/><line x1="340" y1="76" x2="340" y2="92" stroke="${K}" stroke-width="4"/><line x1="340" y1="128" x2="340" y2="144" stroke="${K}" stroke-width="4"/><circle cx="340" cy="110" r="19" fill="${lit?'#ffe066':'#fff'}" stroke="${K}" stroke-width="3.5"/><path d="M331,119 q4.5,-15 9,0 q4.5,-15 9,0" fill="none" stroke="${K}" stroke-width="2.5"/>`;
  // gap: switch or material
  if(o.gap==='switch'){s+=`<rect x="172" y="168" width="56" height="24" fill="#fff"/><circle cx="170" cy="180" r="5.5" fill="${K}"/><circle cx="230" cy="180" r="5.5" fill="${K}"/><line x1="170" y1="180" x2="${o.closed?226:222}" y2="${o.closed?180:150}" stroke="${K}" stroke-width="5" stroke-linecap="round"/>`}
  if(o.gap==='material'){const m=o.mat;s+=`<rect x="172" y="168" width="56" height="24" fill="#fff"/><circle cx="170" cy="180" r="5.5" fill="${K}"/><circle cx="230" cy="180" r="5.5" fill="${K}"/><rect x="178" y="156" width="44" height="48" rx="8" fill="#fff" stroke="${K}" stroke-width="2.5" ${m?'':'stroke-dasharray="5"'}/><text x="200" y="189" font-size="28" text-anchor="middle">${m?m.i:'?'}</text>${m?`<text x="200" y="220" font-size="13" text-anchor="middle" fill="${K}" font-weight="700">${esc(m.n)}</text>`:''}`}
  if(o.wire==='broken')s+=`<rect x="96" y="30" width="28" height="20" fill="#fff"/><circle cx="96" cy="40" r="4.5" fill="#fff" stroke="${K}" stroke-width="2.5"/><circle cx="124" cy="40" r="4.5" fill="#fff" stroke="${K}" stroke-width="2.5"/><text x="110" y="24" font-size="16" text-anchor="middle" fill="#d33">✂ cut!</text>`;
  if(flow)for(let i=0;i<7;i++)s+=`<circle r="5.5" fill="#ffd23f" stroke="${K}" stroke-width="1.5"><animateMotion dur="4.2s" begin="${(-i*0.6).toFixed(1)}s" repeatCount="indefinite"><mpath href="#${id}"/></animateMotion></circle>`;
  if(o.trace!=null){const T=[[60,88],[200,40],[340,108],[280,180],[200,180],[60,165]][o.trace]||[60,88];s+=`<circle cx="${T[0]}" cy="${T[1]}" r="13" fill="#ffd23f" stroke="${K}" stroke-width="3"/>`}
  if(o.labels){const L=(x,y,t,a='middle')=>`<text x="${x}" y="${y}" font-size="13" font-weight="700" fill="${K}" text-anchor="${a}">${t}</text>`;
    s+=L(76,112,'◀ Power source','start')+L(200,16,res?'Resistor':'')+L(324,112,o.load==='led'?'LED ▶':'Bulb ▶','end')+(o.gap==='switch'?L(200,138,'Switch'):'')+L(150,64,'Wire')}
  return `<svg viewBox="0 0 400 ${o.mat?228:206}" class="circ" role="img" aria-label="Circuit diagram: ${flow?'current flowing, load ON':'no current, load OFF'}">${s}</svg>`}

/* ===== shared page pieces ===== */
function topbar(m,extra=''){const p=learnPct(m);return `<nav class="top" aria-label="Module navigation"><button class="ghost sm" onclick="go('/')">🏠 Home</button><button class="ghost sm" onclick="go('/m/${m.id}')">Module ${m.id}</button><div class="ttl">${esc(m.title)}</div>${extra}<div class="bar" aria-label="Module progress ${p}%"><i style="width:${p}%"></i></div><b>${p}%</b></nav>`}
function setPage(html){APP.innerHTML=html;mountAll();APP.focus();window.scrollTo(0,0)}
function kitBlock(kitId){const k=KITS[kitId];if(!k)return '';const g=getGroup();
  return `<div class="panel tint"><h3>👩‍🏫 Teacher: give out Kit ${kitId} now</h3><p>Each student (Group ${g}) receives:</p><ul>${kitItems(kitId,g).map(x=>`<li>${x}</li>`).join('')}</ul><p>Earlier kits stay with the student. <a href="#/teacher">See the full plan</a>.</p></div>`}
function groupPicker(){const g=getGroup();return `<span class="chip">My group: ${['A','B','C'].map(x=>`<button class="sm ${x===g?'':'ghost'}" onclick="setGroup('${x}')" aria-pressed="${x===g}">${x}</button>`).join('')}</span>`}
function setGroup(x){store.set('group',x);route()}

/* ===== pages ===== */
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  try{
    if(h[0]==='teacher')return teacherPage();
    if(h[0]==='m'&&MODS[+h[1]]){const m=MODS[+h[1]];
      if(!isUnlocked(m.id))return setPage(`<div class="panel red"><h2>🔒 Module ${m.id} is locked</h2><p>Finish Module ${m.id-1} first (pass the quiz${MODS[m.id-1]&&MODS[m.id-1].projects.length?' and build the mandatory project':''}).</p><button onclick="go('/')">Back home</button></div>`);
      if(h[2]==='s')return sectionPage(m,Math.min(Math.max(+h[3]||0,0),m.sections.length-1));
      if(h[2]==='quiz')return quizPage(m);
      if(h[2]==='projects')return projectsPage(m);
      if(h[2]==='p')return projectPage(m,h[3]);
      return overviewPage(m)}
  }catch(e){console.error("ROUTE ERR",e.stack)}
  homePage()}

function homePage(){
  const cards=PLAN.map(p=>{const m=MODS[p.n];let status='',btn='',badge='',assess='Assessment: not available yet';
    if(m){const q=mp(m.id).quiz,done=isDone(m),un=isUnlocked(m.id);
      assess=q?(q.passed?`Assessment: passed ${q.score}/10`:`Assessment: last score ${q.score}/10`):'Assessment: not taken';
      if(!un){badge='<span class="badge lock">🔒 Locked</span>';btn=`<button disabled>Finish Module ${m.id-1} first</button>`}
      else if(done){badge='<span class="badge done">✔ COMPLETED</span>';btn=`<button class="good" onclick="go('/m/${m.id}')">Review module</button>`}
      else{const st=learnPct(m)>0;badge=`<span class="badge ${st?'prog':''}">${st?'In progress':'Not started'}</span>`;btn=`<button onclick="go('/m/${m.id}')">${st?'Continue Learning':'Start Learning'}</button>`}}
    else if(p.final){badge='<span class="badge prog">Final project</span>';btn=`<a class="btn" href="${FINAL_URL}" target="_blank" rel="noopener">Open final project</a>`}
    else{badge='<span class="badge soon">Coming soon</span>';btn='<button disabled>Coming soon</button>'}
    return `<article class="mcard ${badge.includes('lock')?'lock':''}"><div class="art" style="background:${p.bg}"><span aria-hidden="true">${p.icon}</span><b>Module ${p.n}</b></div><div class="body"><h3>${esc(p.name)}</h3>${badge}<p>${esc(p.desc)}</p><div class="meta"><span>📖 ${p.secs} learning sections</span><span>📝 ${assess}</span></div>${m?`<div class="row">${percent(learnPct(m))}<b>${learnPct(m)}%</b></div>`:''}<div class="sp"></div>${btn}</div></article>`}).join('');

let QZ=null;
function quizPage(m){
  if(!allSeen(m))return setPage(`${topbar(m)}<div class="panel tint"><h2>Finish learning first</h2><p>Visit every learning section, then come back.</p><button onclick="go('/m/${m.id}')">Back to module</button></div>`);
  if(!QZ||QZ.mid!==m.id)QZ={mid:m.id,i:0,a:Array(10).fill(null),done:false};
  drawQuiz()}
function drawQuiz(){const m=MODS[QZ.mid],q=m.quiz[QZ.i],a=QZ.a[QZ.i];
  if(QZ.done)return resultPage(m);
  let body='';
  if(q.t==='match')body=q.l.map((l,k)=>`<div class="mrow"><span>${esc(l)}</span><select aria-label="${esc(l)}" onchange="qSet(${k},this.value)"><option value="">Choose…</option>${q.r.map((r,j)=>`<option value="${j}" ${a&&a[k]==j&&a[k]!==''?'selected':''}>${esc(r)}</option>`).join('')}</select></div>`).join('');
  else body=`<div class="opts">${q.o.map((o,j)=>`<button class="opt ${a===j?'sel':''}" onclick="qSet(${j})">${esc(o)}</button>`).join('')}</div>`;
  setPage(`${topbar(m)}<h2>Assessment: Question ${QZ.i+1} of 10</h2>${percent((QZ.i+1)*10)}<div class="panel q"><p class="big">${esc(q.q)}</p>${q.img?`<div>${q.img()}</div>`:''}${body}</div><div class="row"><button class="ghost" ${QZ.i?'':'disabled'} onclick="qGo(-1)">◀ Back</button><span class="sp"></span>${QZ.i<9?`<button onclick="qGo(1)">Next ▶</button>`:`<button class="good" onclick="qSubmit()">Submit answers</button>`}</div><p id="cnt">${cntTxt(m)}</p><div class="dots">${m.quiz.map((qq,k)=>`<a href="javascript:void 0" onclick="QZ.i=${k};drawQuiz()" class="${k===QZ.i?'cur':isAns(qq,QZ.a[k])?'seen':''}" aria-label="Question ${k+1}${isAns(qq,QZ.a[k])?' answered':' not answered'}">${k+1}</a>`).join('')}</div>`)}
const cntTxt=m=>{const n=m.quiz.filter((q,k)=>isAns(q,QZ.a[k])).length;return `${n} of 10 answered. ${n<10?'Green numbers are answered.':'All done! Press Submit.'}`};
function qSet(k,v){if(MODS[QZ.mid].quiz[QZ.i].t==='match'){const q=MODS[QZ.mid].quiz[QZ.i];const a=QZ.a[QZ.i]||Array(q.l.length).fill('');a[k]=v;QZ.a[QZ.i]=a;drawQuiz();return}
  QZ.a[QZ.i]=k;drawQuiz()}
function qGo(d){QZ.i+=d;drawQuiz()}
const isAns=(q,a)=>a!==null&&a!==undefined&&(q.t==='match'?q.l.every((_,k)=>a[k]!==''&&a[k]!==undefined):true);
function isRight(q,a){if(a===null||a===undefined)return false;return q.t==='match'?q.a.every((x,k)=>String(a[k])===String(x)):a===q.a}
function qSubmit(){const m=MODS[QZ.mid];const un=m.quiz.map((q,i)=>isAns(q,QZ.a[i])?0:i+1).filter(Boolean);
  if(un.length){alert(`Please answer question ${un.join(', ')} first. For matching questions, choose an answer in every row.`);QZ.i=un[0]-1;drawQuiz();return}
  const score=m.quiz.reduce((n,q,i)=>n+(isRight(q,QZ.a[i])?1:0),0),p=mp(m.id),pass=score>=8;
  p.quiz={score,passed:pass||!!(p.quiz&&p.quiz.passed)};save();QZ.done=true;QZ.score=score;QZ.pass=pass;drawQuiz()}
function resultPage(m){const sc=QZ.score,pass=QZ.pass;
  setPage(`${topbar(m)}<div class="panel ${pass?'green':'red'}"><div class="score">${sc} / 10</div><h2>${pass?'PASSED 🎉':'TRY AGAIN'}</h2>${pass?`<span class="badge done">✔ COMPLETED quiz</span><p>${m.projects.length?'Your projects are unlocked! Build the mandatory project to complete this module.':'Module complete! Great learning.'}</p>`:'<p>You need 8 correct answers to pass. Read the explanations, then try again.</p>'}<div class="row">${pass?(m.projects.length?`<button onclick="go('/m/${m.id}/projects')">🛠 Choose your project</button>`:`<button onclick="go('/m/${m.id}')">Module page</button>`):''}${!pass?`<button onclick="QZ=null;quizPage(MODS[${m.id}])">Restart assessment</button><button class="ghost" onclick="go('/m/${m.id}/s/0')">Relearn module</button>`:`<button class="ghost" onclick="QZ=null;quizPage(MODS[${m.id}])">Take again</button>`}</div></div>${pass&&m.kit?kitBlock(m.kit):''}
  ${m.quiz.map((q,i)=>{const ok=isRight(q,QZ.a[i]);const mine=QZ.a[i]===null?'(no answer)':q.t==='match'?q.l.map((l,k)=>`${l} → ${QZ.a[i][k]===''||QZ.a[i][k]===undefined?'?':q.r[QZ.a[i][k]]}`).join('; '):q.o[QZ.a[i]];
    const right=q.t==='match'?q.l.map((l,k)=>`${l} → ${q.r[q.a[k]]}`).join('; '):q.o[q.a];
    return `<div class="res ${ok?'ok':'no'}"><b>${ok?'✔':'✘'} Q${i+1}. ${esc(q.q)}</b>${ok?'':`<br>Your answer: ${esc(mine)}`}<br>Correct answer: ${esc(right)}<br><i>${esc(q.why)}</i></div>`}).join('')}`)}

const sunDemo=()=>widget({state:{sky:'sun'},
 render(s,id){const em={sun:'☀️',cloud:'⛅',night:'🌙'}[s.sky],g={sun:1,cloud:.45,night:0}[s.sky];
  return `<p class="big">${em} A solar-powered lamp</p>${circuit({src:s.sky!=='night',gap:'none',glow:g,color:'#ffd23f',labels:true,res:false})}
  <div class="ctl">${btn(id,'s','☀️ Sunny',s.sky==='sun'?'good':'ghost','sun')}${btn(id,'s','⛅ Cloudy',s.sky==='cloud'?'good':'ghost','cloud')}${btn(id,'s','🌙 Night',s.sky==='night'?'good':'ghost','night')}</div>
  ${say(g>0,g===1?'Bright sunlight: the panel makes lots of electricity. The lamp is bright.':'Clouds block some light: less electricity, so the lamp is dim.','No sunlight: no electricity from the panel, so the lamp is OFF.')}`},
 act(s,k,v){s.sky=v}});

const wireDemo=(load)=>widget({state:{wire:'good'},
 render(s,id){const ok=s.wire==='good';
  return `${circuit({wire:s.wire,gap:'none',load,res:load==='led',labels:true})}
  <div class="ctl">${btn(id,'w','✂ Disconnect the wire',ok?'bad':'ghost','broken')}${btn(id,'w','🔧 Reconnect the wire',ok?'ghost':'good','good')}</div>
  ${say(ok,'The path is complete. Current flows (yellow dots) and the light is ON.','The wire is cut. The path is broken, current stops and the light is OFF.')}`},
 act(s,k,v){s.wire=v}});

const MATS=[{n:'Copper wire',i:'🟠',c:1},{n:'Iron nail',i:'🔩',c:1},{n:'Coin',i:'🪙',c:1},{n:'Pencil lead',i:'✏️',c:1},{n:'Plastic ruler',i:'📏',c:0},{n:'Rubber band',i:'⭕',c:0},{n:'Wooden stick',i:'🪵',c:0},{n:'Dry paper',i:'📄',c:0}];
const matDemo=()=>widget({state:{m:null,t:{}},
 render(s,id){const m=s.m!==null?MATS[s.m]:null;
  return `<p>Pick a material to place between the two wire ends:</p><div class="ctl">${MATS.map((x,i)=>btn(id,'m',`${x.i} ${x.n}`,s.m===i?'blue':'ghost sm',i)).join('')}</div>
  ${circuit({gap:'material',mat:m,labels:false})}
  ${m?say(m.c,`${m.n} is a <b>conductor</b>. Current passes, so the LED glows.`,`${m.n} is an <b>insulator</b>. Current cannot pass, so the LED stays OFF.`):'<div class="say off">Choose a material to test.</div>'}
  <p><b>Your results:</b> ${Object.keys(s.t).length?MATS.filter((x,i)=>s.t[i]!==undefined).map(x=>`${x.c?'✅':'⛔'} ${x.n}`).join(' · '):'none yet'}</p>`},
 act(s,k,v){s.m=v;s.t[v]=1}});

const SAFE=[['Using a 5 V USB supply for our experiments',1,'Low voltage is the safe choice for learning.'],['Poking a wire into a wall socket',0,'Wall sockets can seriously hurt you. Never do this.'],['Touching switches or plugs with wet hands',0,'Water helps electricity pass through your body. Dry your hands first.'],['Unplugging the USB before changing the circuit',1,'Power OFF first, then change wires.'],['Asking a teacher to check the circuit before power ON',1,'A second pair of eyes catches mistakes.'],['Pulling a plug out by its wire',0,'Hold the plug itself. Pulling the wire can break it.']];
const safeDemo=()=>widget({state:{i:0,sc:0,r:null},
 render(s,id){if(s.i>=SAFE.length)return `<div class="say">🎉 You finished! Score: ${s.sc} / ${SAFE.length}</div><div class="ctl">${btn(id,'again','Play again','ghost')}</div>`;
  const c=SAFE[s.i];return `<p class="big">Is this SAFE or UNSAFE?</p><div class="panel"><b>${c[0]}</b></div>${s.r===null?`<div class="ctl">${btn(id,'a','✅ Safe','good',1)}${btn(id,'a','⛔ Unsafe','bad',0)}</div>`:`${say(s.r,'✔ Correct! '+c[2],'✘ Not quite. '+c[2])}<div class="ctl">${btn(id,'n','Next ▶')}</div>`}<p>Question ${s.i+1} of ${SAFE.length}</p>`},
 act(s,k,v){if(k==='a'){s.r=SAFE[s.i][1]===v;if(s.r)s.sc++}else if(k==='n'){s.i++;s.r=null}else{s.i=0;s.sc=0;s.r=null}}});

const partsDemo=()=>widget({state:{src:false,wires:false,load:false,sw:true},
 render(s,id){const miss=[!s.src&&'power source',!s.wires&&'wires',!s.load&&'bulb'].filter(Boolean),on=!miss.length&&s.sw;
  return `<div class="ctl">${btn(id,'src',(s.src?'✔ ':'+ ')+'Power source',s.src?'good':'ghost')}${btn(id,'wires',(s.wires?'✔ ':'+ ')+'Wires',s.wires?'good':'ghost')}${btn(id,'load',(s.load?'✔ ':'+ ')+'Bulb',s.load?'good':'ghost')}${btn(id,'sw',s.sw?'Switch: ON (closed)':'Switch: OFF (open)',s.sw?'good':'bad')}</div>
  ${circuit({src:s.src,wire:s.wires?'good':'broken',noLoad:!s.load,load:'bulb',res:false,closed:s.sw,labels:true})}
  ${miss.length?say(0,'','Still missing: '+miss.join(', ')+'. The loop is not complete.'):say(on,'Complete loop and switch closed: the bulb glows!','The loop is complete but the switch is open, so the bulb is OFF.')}`},
 act(s,k){s[k]=!s[k]}});

const srcDemo=()=>widget({state:{s:'none'},
 render(s,id){const on=s.s!=='none',t={none:'No power source: nothing pushes the current.',battery:'A battery pushes current around the circuit.',usb:'A USB supply gives 5 volts. This is what we use in our kit.'}[s.s];
  return `${circuit({src:on,gap:'switch',closed:true,load:'bulb',res:false,labels:true})}<div class="ctl">${btn(id,'s','No source',s.s==='none'?'bad':'ghost','none')}${btn(id,'s','🔋 Battery',s.s==='battery'?'good':'ghost','battery')}${btn(id,'s','🔌 USB 5 V',s.s==='usb'?'good':'ghost','usb')}</div>${say(on,t,t)}`},
 act(s,k,v){s.s=v}});

const pairDemo=()=>widget({state:{a:true,b:false},
 render(s,id){const c=(k,n)=>`<div><h3>${n}: ${s[k]?'CLOSED':'OPEN'}</h3>${circuit({closed:s[k],load:'bulb',res:false})}<div class="ctl">${btn(id,k,s[k]?'Open the switch':'Close the switch',s[k]?'bad':'good')}</div>${say(s[k],'Path complete: bulb ON','Path broken: bulb OFF')}</div>`;
  return `<div class="two">${c('a','Circuit A')}${c('b','Circuit B')}</div>`},
 act(s,k){s[k]=!s[k]}});

const STOPS=['Current leaves the + end of the power source.','It travels along the top wire.','It reaches the bulb. The bulb turns electrical energy into light and heat.','It carries on along the right-hand wire.','It passes through the closed switch.','It returns to the − end of the power source. Then it goes round again!'];
const traceDemo=()=>widget({state:{t:0},
 render(s,id){return `${circuit({trace:s.t,load:'bulb',res:false,labels:true})}<p class="say">Stop ${s.t+1} of 6: ${STOPS[s.t]}</p><div class="ctl">${s.t>0?btn(id,'p','◀ Back','ghost'):''}${s.t<5?btn(id,'n','Follow the current ▶'):btn(id,'r','Start again','good')}</div>`},
 act(s,k){s.t=k==='n'?s.t+1:k==='p'?s.t-1:0}});

const waterViz=()=>{const K='#12263f',dots=(y,c,n)=>Array.from({length:n},(_,i)=>`<circle r="6" cy="${y}" fill="${c}" stroke="${K}" stroke-width="1.5"><animateMotion dur="4s" begin="${-i*(4/n)}s" repeatCount="indefinite" path="M60,0 H340"/></circle>`).join('');
 return `<svg viewBox="0 0 400 230" class="circ" role="img" aria-label="Water flows through a pipe; electric current flows through a wire"><text x="200" y="22" font-size="15" font-weight="700" text-anchor="middle" fill="${K}">💧 Water in a pipe</text><rect x="50" y="42" width="300" height="32" rx="16" fill="#bfe3ff" stroke="${K}" stroke-width="3"/><g transform="translate(0,58)">${dots(0,'#2f9bff',7)}</g><text x="200" y="98" font-size="13" text-anchor="middle" fill="${K}">A pump pushes water. Water flows along the pipe.</text>
 <text x="200" y="136" font-size="15" font-weight="700" text-anchor="middle" fill="${K}">⚡ Electric current in a wire</text><rect x="50" y="156" width="300" height="32" rx="16" fill="#f4c58d" stroke="${K}" stroke-width="3"/><g transform="translate(0,172)">${dots(0,'#ffd23f',7)}</g><text x="200" y="212" font-size="13" text-anchor="middle" fill="${K}">A power source pushes current. It flows along the wire.</text></svg>`};
const wireSection=()=>`<svg viewBox="0 0 400 190" class="circ" role="img" aria-label="Cross-section of a wire: copper core inside plastic coating"><circle cx="120" cy="95" r="80" fill="#4f6cff" stroke="#12263f" stroke-width="4"/><circle cx="120" cy="95" r="46" fill="#d98a3a" stroke="#12263f" stroke-width="4"/><text x="250" y="60" font-size="16" font-weight="700" fill="#12263f">Copper core</text><text x="250" y="80" font-size="13" fill="#12263f">(conductor: carries current)</text><text x="250" y="130" font-size="16" font-weight="700" fill="#12263f">Plastic cover</text><text x="250" y="150" font-size="13" fill="#12263f">(insulator: keeps us safe)</text><line x1="166" y1="85" x2="244" y2="58" stroke="#12263f" stroke-width="2"/><line x1="186" y1="125" x2="244" y2="128" stroke="#12263f" stroke-width="2"/></svg>`;
const matCard=(img)=>`<div class="mini"><span class="em">${img[0]}</span>${img[1]}</div>`;
