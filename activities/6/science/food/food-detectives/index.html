    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
        }
        
        #info-panel {
            position: absolute; 
            top: 20px; 
            left: 20px; 
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px); 
            padding: 15px 25px; 
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            border: 3px solid #ffb882;
            z-index: 10; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            flex-wrap: wrap;
        }
        
        #info-panel h1 { 
            margin: 0; 
            font-size: 2rem; 
            color: #2d3e50; 
        }
        
        #mode-toggle {
            display: flex; 
            gap: 10px; 
            background: #e0e7ff; 
            padding: 5px; 
            border-radius: 60px;
        }
        
        .mode-btn {
            border: none; 
            padding: 8px 22px; 
            border-radius: 40px; 
            font-weight: bold;
            font-size: 1.3rem; 
            cursor: pointer; 
            transition: 0.2s; 
            background: transparent;
        }
        
        .mode-btn.active { 
            background: #2d3e50; 
            color: white; 
            box-shadow: 0 2px 10px #2d3e5080; 
        }
        
        #quiz-panel {
            position: absolute; 
            top: 120px; 
            right: 20px; 
            width: 280px;
            max-width: calc(100vw - 40px);
            background: rgba(255,251,235,0.98); 
            border-radius: 24px; 
            padding: 16px;
            box-shadow: 0 20px 35px rgba(120, 60, 30, 0.3); 
            border: 4px solid #ffb347;
            z-index: 25; 
            backdrop-filter: blur(10px); 
            font-size: 1rem;
            transition: 0.3s; 
            max-height: calc(100vh - 220px);
            overflow-x: hidden;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        #quiz-header { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        
        #quiz-header h2 { 
            margin: 0; 
            color: #7b3f00; 
            font-size: 1.5rem; 
        }
        
        #question-box {
            background: #fdeacb; 
            border-radius: 20px; 
            padding: 14px 12px;
            border: 3px dashed #c59b6c; 
            margin-bottom: 12px;
        }
        
        #question-text { 
            font-size: 1.2rem; 
            font-weight: bold; 
            color: #412d1b; 
            margin: 8px 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        #explanation-box {
            background: #f9f3e9; 
            border-radius: 20px; 
            padding: 14px;
            border-left: 8px solid #5f9ea0; 
            display: none; 
            margin-top: 12px;
            max-width: 100%;
            overflow: hidden;
        }
        
        #explanation-box.show { 
            display: block; 
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .exp-head { 
            font-size: 1.2rem; 
            margin-bottom: 8px; 
            display: flex; 
            gap: 8px; 
        }
        
        .exp-content { 
            line-height: 1.5; 
            color: #2c3e50;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        .exp-content p { 
            margin: 10px 0; 
        }
        
        .quiz-result {
            font-size: 1.15rem;
            font-weight: bold;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: center;
            animation: fadeIn 0.3s ease-in;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }
        
        .quiz-result-right {
            background: #c8e6c9;
            color: #1b5e20;
            border: 3px solid #2e7d32;
            box-shadow: 0 4px 8px rgba(46, 125, 50, 0.3);
        }
        
        .quiz-result-wrong {
            background: #ffcdd2;
            color: #b71c1c;
            border: 3px solid #c62828;
            box-shadow: 0 4px 8px rgba(198, 40, 40, 0.3);
        }
        
        .hint-message {
            background: #fff8e1;
            border-left: 6px solid #ffa000;
            padding: 10px 12px;
            border-radius: 10px;
            margin: 8px 0;
            box-shadow: 0 2px 6px rgba(255, 160, 0, 0.2);
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }
        
        .quiz-controls { 
            display: flex; 
            gap: 8px; 
            margin: 10px 0; 
            flex-wrap: wrap; 
        }
        
        .quiz-btn {
            background: #ffd89a; 
            border: none; 
            border-radius: 50px; 
            padding: 10px 14px;
            font-weight: bold; 
            font-size: 1rem; 
            cursor: pointer; 
            flex: 1 1 auto;
            transition: 0.1s; 
            border-bottom: 4px solid #b87c3a;
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }
        
        .quiz-btn:hover {
            background: #ffcc80;
            transform: translateY(-2px);
        }
        
        .quiz-btn:active { 
            transform: translateY(4px); 
            border-bottom-width: 0; 
        }
        
        #test-kit {
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%);
            display: flex; 
            gap: 15px; 
            background: rgba(30, 30, 40, 0.8);
            backdrop-filter: blur(12px); 
            padding: 18px 30px; 
            border-radius: 80px;
            border: 3px solid #ffd966; 
            z-index: 40;
        }
        
        .test-btn {
            background: #f8f9fa; 
            border: none; 
            border-radius: 50px; 
            padding: 12px 22px;
            font-size: 1.4rem; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            cursor: pointer; 
            transition: 0.2s; 
            box-shadow: 0 5px 0 #6c757d;
            border-bottom: 3px solid #495057; 
            pointer-events: auto;
        }
        
        .test-btn.starch { 
            background: #cdb4db; 
            color: #3c096c; 
        }
        
        .test-btn.protein { 
            background: #b7e4c7; 
            color: #1e4a2b; 
        }
        
        .test-btn.fat { 
            background: #ffd7ba; 
            color: #9e4a1f; 
        }
        
        .test-btn.reset { 
            background: #e9ecef; 
            color: #2b3d4f; 
            font-size: 1.2rem; 
        }
        
        .test-btn.active {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        #learn-log {
            background: #fffcf0; 
            border-radius: 20px; 
            padding: 12px; 
            margin-top: 12px;
            max-height: 240px; 
            overflow-y: auto;
            overflow-x: hidden;
            border: 2px solid #ebb472;
            max-width: 100%;
        }
        
        .learn-item { 
            padding: 8px 12px; 
            border-radius: 20px; 
            margin: 6px 0; 
            background: #f7efe2; 
            border-left: 8px solid #aaaaaa;
            animation: fadeIn 0.4s ease-in;
        }
        
        .learn-item.starch { 
            border-left-color: #1e3a5f; 
            background: #e3f2fd; 
        }
        
        .learn-item.protein { 
            border-left-color: #7b2e8a; 
            background: #f3e5f5; 
        }
        
        .learn-item.fat { 
            border-left-color: #b85e00; 
            background: #fff3e0; 
        }
        
        .safety-ribbon { 
            position: absolute; 
            bottom: 130px; 
            left: 20px; 
            background: #ffd966ee; 
            padding: 8px 24px; 
            border-radius: 40px; 
            font-weight: bold; 
            z-index: 50; 
            border: 2px solid #b1610e; 
            white-space: nowrap;
        }
        
        /* Bouncing animation for food labels */
        @keyframes bounce {
            0%, 100% { 
                transform: translateY(0); 
            }
            50% { 
                transform: translateY(-10px); 
            }
        }
        
        .food-label {
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
            white-space: nowrap;
        }

        .food-label-motion {
            display: inline-flex;
            align-items: center;
            animation: bounce 2s ease-in-out infinite;
        }

        .food-label-content {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-width: 92px;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: #2d3e50;
            text-shadow: none;
            background: rgba(255, 255, 248, 0.92);
            padding: 6px 10px;
            border-radius: 14px;
            border: 2px solid rgba(255, 184, 130, 0.95);
            box-shadow: 0 5px 14px rgba(80, 45, 20, 0.18);
            backdrop-filter: blur(5px);
            transition: transform 0.2s;
        }
        
        .food-label .food-emoji {
            font-size: 28px;
            line-height: 1;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
        }
        
        .food-label .food-name {
            font-size: 15px;
            line-height: 1;
        }
        
        .food-label:hover .food-label-motion {
            animation-play-state: paused;
        }

        .food-label:hover .food-label-content {
            transform: scale(1.18);
        }
        
        /* Hover bubble – translucent white rounded rectangle, emoji only (no name) */
        .food-tooltip {
            position: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 16px;
            font-size: 36px;
            line-height: 1;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.9);
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translate(-50%, 8px);
            backdrop-filter: blur(10px);
            left: 0;
            top: 0;
        }
        
        .food-tooltip.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 720px) {
            .food-label-content {
                min-width: 78px;
                gap: 5px;
                padding: 5px 8px;
            }

            .food-label .food-emoji {
                font-size: 24px;
            }

            .food-label .food-name {
                font-size: 13px;
            }
        }

        @media (max-width: 460px) {
            .food-label-content {
                min-width: 62px;
                gap: 4px;
                padding: 4px 6px;
            }

            .food-label .food-name {
                display: inline;
                font-size: 11px;
            }
        }

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ========== CENTRALIZED FOOD DATA ==========
        const foods = [
            { name: '🥔 potato', label: 'Potato', pos: [-2.0, 0.2, 0.5], starch: true, protein: false, fat: false, color: 0xc99a6b, emoji: '🥔', fact: 'Potatoes store energy as starch — like a battery for the plant!', rhyme: 'Potato brown, starch in town.' },
            { name: '🌾 rice', label: 'Rice', pos: [0.5, 0.1, -0.8], starch: true, protein: false, fat: false, color: 0xf5f0d7, emoji: '🌾', fact: 'Rice grains are full of starch, which gives you running power.', rhyme: 'Rice is nice, starch gives spice.' },
            { name: '🥖 bread', label: 'Bread', pos: [2.2, 0.3, 1.2], starch: true, protein: false, fat: false, color: 0xe0b059, emoji: '🥖', fact: 'Bread bubbles from yeast, but the starch is what turns iodine blue!', rhyme: 'Bread in the toaster, starch is the booster.' },
            { name: '🥚 egg white', label: 'Egg', pos: [-1.2, 0.5, 2.5], starch: false, protein: true, fat: true, color: 0xf3f0e0, emoji: '🥚', fact: 'Egg whites are almost pure protein — they help chicks grow muscles!', rhyme: 'Egg white and yolk, protein for folk.' },
            { name: '🫘 dal', label: 'Dal', pos: [1.8, 0.2, -1.8], starch: false, protein: true, fat: false, color: 0xb37b5e, emoji: '🫘', fact: 'Lentils (dal) are plant-based protein — body building blocks!', rhyme: 'Dal is protein, strong and lean.' },
            { name: '🧈 butter', label: 'Butter', pos: [-2.5, 0.3, -1.8], starch: false, protein: false, fat: true, color: 0xffe57a, emoji: '🧈', fact: 'Butter is mostly fat — it leaves a permanent grease spot on paper.', rhyme: 'Butter melt, fat is felt.' },
            { name: '🥜 peanut', label: 'Peanut', pos: [3.0, 0.2, 0.0], starch: false, protein: true, fat: true, color: 0xc49a6c, emoji: '🥜', fact: 'Peanuts have protein for muscles AND fat for energy!', rhyme: 'Peanut double-pack: protein and fat snack.' },
            { name: '🍎 apple', label: 'Apple', pos: [0.0, 0.3, 2.8], starch: false, protein: false, fat: false, color: 0xeF4f4f, emoji: '🍎', fact: 'Apples have natural sugar and fibre — but no starch, protein or fat.', rhyme: 'Apple fresh, no starchy mess.' },
            { name: '🥛 milk', label: 'Milk', pos: [-3.5, 0.4, -2.5], starch: false, protein: true, fat: true, color: 0xffffff, emoji: '🥛', fact: 'Milk has protein for growth and fat for energy — perfect for babies!', rhyme: 'Milk is white, protein and fat are right.' }
        ];

        // ========== STATE MANAGEMENT ==========
        let currentMode = 'learn'; // 'learn' or 'quiz'
        let currentTest = null;     // 'starch', 'protein', 'fat', or null (for Learn Mode)
        let currentQuizTarget = null; // 'starch', 'protein', 'fat', or 'none' (for Quiz Mode)

        // ========== 3D SCENE SETUP ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa8e6cf);
        scene.fog = new THREE.Fog(0xa8e6cf, 15, 30);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 12);
        camera.lookAt(0, 1, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // Don't block clicks by default
        labelRenderer.domElement.style.backgroundColor = 'transparent';
        labelRenderer.domElement.style.zIndex = '8';
        document.body.appendChild(labelRenderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 5;
        controls.maxDistance = 20;
        controls.target.set(0, 1.5, 0);

        // Lights
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        
        const mainLight = new THREE.DirectionalLight(0xfff5d1, 1.2);
        mainLight.position.set(5, 10, 7);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        const d = 10;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        mainLight.shadow.camera.near = 2;
        mainLight.shadow.camera.far = 20;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0xffeedd, 0.5);
        fillLight.position.set(-3, 4, 5);
        scene.add(fillLight);
        
        // Floor
        const planeGeometry = new THREE.CircleGeometry(12, 32);
        const planeMaterial = new THREE.MeshStandardMaterial({ color: 0xd9b382 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = 0;
        plane.receiveShadow = true;
        scene.add(plane);
        
        // Decoration
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xaaccff });
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5), pillarMat);
        pillar.position.set(-3, 0.75, -3);
        pillar.castShadow = true;
        pillar.receiveShadow = true;
        scene.add(pillar);

        // ========== CREATE FOOD OBJECTS ==========
        const foodMeshes = [];
        const foodLabels = [];

        function addFoodDetails(mesh, food) {
            const darker = new THREE.MeshStandardMaterial({ color: 0x7a5638, roughness: 0.8 });
            const pale = new THREE.MeshStandardMaterial({ color: 0xfff8df, roughness: 0.75 });

            if (food.label === 'Potato') {
                mesh.scale.set(1.18, 0.82, 0.9);
                [[0.18, 0.28, 0.4], [-0.22, 0.1, 0.42], [0.05, -0.18, 0.43]].forEach(([x, y, z]) => {
                    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 12), darker);
                    eye.position.set(x, y, z);
                    mesh.add(eye);
                });
            } else if (food.label === 'Rice') {
                mesh.scale.set(1.15, 0.35, 0.85);
                for (let i = 0; i < 7; i += 1) {
                    const grain = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), pale);
                    grain.scale.set(1.8, 0.55, 0.75);
                    grain.position.set((i - 3) * 0.12, 0.24 + Math.sin(i) * 0.03, 0.34 + Math.cos(i) * 0.03);
                    grain.rotation.z = i * 0.45;
                    mesh.add(grain);
                }
            } else if (food.label === 'Bread') {
                mesh.scale.set(1.45, 0.58, 0.75);
                const sliceMat = new THREE.MeshStandardMaterial({ color: 0xffd48a, roughness: 0.65 });
                [-0.24, 0, 0.24].forEach((x) => {
                    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.5, 0.9), sliceMat);
                    stripe.position.set(x, 0.02, 0.2);
                    stripe.rotation.z = 0.18;
                    mesh.add(stripe);
                });
            } else if (food.label === 'Egg') {
                mesh.scale.set(1.28, 0.38, 0.92);
                const yolkMat = new THREE.MeshStandardMaterial({ color: 0xffc83d, roughness: 0.55, emissive: 0x331a00, emissiveIntensity: 0.04 });
                const yolk = new THREE.Mesh(new THREE.SphereGeometry(0.18, 24, 24), yolkMat);
                yolk.scale.set(1, 0.32, 1);
                yolk.position.set(0.06, 0.34, 0.2);
                mesh.add(yolk);
            } else if (food.label === 'Dal') {
                mesh.scale.set(1.1, 0.32, 0.9);
                const lentilMat = new THREE.MeshStandardMaterial({ color: 0xc88450, roughness: 0.8 });
                for (let i = 0; i < 8; i += 1) {
                    const lentil = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), lentilMat);
                    lentil.scale.set(1.1, 0.35, 0.95);
                    lentil.position.set(Math.cos(i) * 0.25, 0.25 + (i % 2) * 0.03, Math.sin(i) * 0.18 + 0.2);
                    mesh.add(lentil);
                }
            } else if (food.label === 'Butter') {
                mesh.scale.set(1.2, 0.55, 0.85);
                const patMat = new THREE.MeshStandardMaterial({ color: 0xfff0a8, roughness: 0.45 });
                const pat = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.22, 0.44), patMat);
                pat.position.set(0, 0.26, 0.12);
                mesh.add(pat);
            } else if (food.label === 'Peanut') {
                mesh.scale.set(1.55, 0.55, 0.62);

        // ========== TOOLTIP HELPER ==========
        function updateTooltipPositionFromMesh(tooltip, mesh, event) {
            // Convert 3D world position to screen coordinates
            const vector = new THREE.Vector3();
            
            // For groups, get position from the group itself
            if (mesh.isGroup) {
                mesh.getWorldPosition(vector);
            } else {
                mesh.getWorldPosition(vector);
            }
            
            vector.project(camera);
            
            const rect = renderer.domElement.getBoundingClientRect();
            const x = (vector.x * 0.5 + 0.5) * rect.width + rect.left;
            const y = (-vector.y * 0.5 + 0.5) * rect.height + rect.top;
            
            // Position bubble centered above the food (bubble uses transform: translate(-50%, 0))
            const offsetY = -55;
            let tooltipX = x;
            let tooltipY = y + offsetY;
            const bubbleSize = 56;
            if (tooltipX - bubbleSize / 2 < 10) tooltipX = 10 + bubbleSize / 2;
            if (tooltipX + bubbleSize / 2 > window.innerWidth - 10) tooltipX = window.innerWidth - 10 - bubbleSize / 2;
            if (tooltipY - bubbleSize / 2 < 10) tooltipY = 10 + bubbleSize / 2;
            if (tooltipY + bubbleSize / 2 > window.innerHeight - 10) tooltipY = window.innerHeight - 10 - bubbleSize / 2;
            tooltip.style.left = tooltipX + 'px';
            tooltip.style.top = tooltipY + 'px';
        }
        
        function updateTooltipPosition(tooltip, event) {
            // For label tooltips, use cursor position but closer
            const offsetX = 0;
            const offsetY = -50;
            let x = event.clientX + offsetX;
            let y = event.clientY + offsetY;
            const bubbleSize = 56;
            if (x - bubbleSize / 2 < 10) x = 10 + bubbleSize / 2;
            if (x + bubbleSize / 2 > window.innerWidth - 10) x = window.innerWidth - 10 - bubbleSize / 2;
            if (y - bubbleSize / 2 < 10) y = 10 + bubbleSize / 2;
            if (y + bubbleSize / 2 > window.innerHeight - 10) y = window.innerHeight - 10 - bubbleSize / 2;
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
        }

                entry.style.borderLeftColor = '#1e3a5f'; // blue-black

                entry.style.borderLeftColor = '#7b2e8a'; // violet
            } else if (type === 'fat') {

            }
            
            entry.textContent = message;
            learnLogDiv.appendChild(entry); // Append (not prepend) to accumulate
            
            // Keep max 10 entries
            while (learnLogDiv.children.length > 10) {
                learnLogDiv.removeChild(learnLogDiv.firstChild);

            learnLogDiv.scrollTop = learnLogDiv.scrollHeight;

        document.addEventListener('click', (e) => {

            if (target) {

                const foodIndex = parseInt(target.getAttribute('data-food-index'));
                if (!isNaN(foodIndex) && foods[foodIndex] && foodMeshes[foodIndex]) {

        // 3D object clicks (raycasting) - also handle mouseover for tooltips
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredMesh = null;
        
        function handleCanvasClick(event) {
            // Don't process if clicking on a label (labels handle their own clicks)
            if (event.target.classList && event.target.classList.contains('food-label')) {
                return;
            }
            
            // Don't process if clicking on UI elements (including buttons)
            if (event.target.closest('#quiz-panel') || 
                event.target.closest('#test-kit') || 
                event.target.closest('#info-panel') ||
                event.target.closest('.quiz-btn') ||
                event.target.closest('.test-btn') ||
                event.target.closest('.mode-btn')) {
                return;
            }
            
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            // Include children for groups (like milk glass)
            const intersects = raycaster.intersectObjects(foodMeshes, true);
            
            if (intersects.length > 0) {
                let hit = intersects[0].object;
                
                // If we hit a child of a group (like milk glass), find the parent group
                if (hit.userData && hit.userData.parentGroup) {
                    hit = hit.userData.parentGroup;
                } else {
                    // Traverse up to find parent group with food data
                    while (hit.parent && hit.parent !== scene) {
                        if (hit.parent.userData && hit.parent.userData.food) {
                            hit = hit.parent;
                            break;
                        }
                        hit = hit.parent;
                    }
                }
                
                if (hit.userData && hit.userData.food) {
                    const food = hit.userData.food;
                    handleFoodClick(food, hit);
                }
            }
        }
        
        function handleCanvasMouseMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            // Include children for groups (like milk glass)
            const intersects = raycaster.intersectObjects(foodMeshes, true);
            
            if (hoveredMesh && hoveredMesh.userData && hoveredMesh.userData.tooltip) {
                hoveredMesh.userData.tooltip.classList.remove('show');
            }
            
            if (intersects.length > 0) {
                let hitObject = intersects[0].object;
                
                // If we hit a child of a group (like milk glass), find the parent group
                if (hitObject.userData && hitObject.userData.parentGroup) {
                    hitObject = hitObject.userData.parentGroup;
                } else {
                    // Traverse up to find parent group with food data
                    while (hitObject.parent && hitObject.parent !== scene) {
                        if (hitObject.parent.userData && hitObject.parent.userData.food) {
                            hitObject = hitObject.parent;
                            break;
                        }
                        hitObject = hitObject.parent;
                    }
                }
                
                // Make sure we have a food object
                if (hitObject.userData && hitObject.userData.food) {
                    hoveredMesh = hitObject;
                    if (hoveredMesh.userData.tooltip) {
                        hoveredMesh.userData.tooltip.classList.add('show');
                        updateTooltipPositionFromMesh(hoveredMesh.userData.tooltip, hoveredMesh, event);
                    }
                } else {
                    hoveredMesh = null;
                }
            } else {
                hoveredMesh = null;
            }
        }
        
        function handleCanvasMouseLeave() {
            if (hoveredMesh && hoveredMesh.userData.tooltip) {
                hoveredMesh.userData.tooltip.classList.remove('show');
            }
            hoveredMesh = null;
        }
        
        renderer.domElement.addEventListener('click', handleCanvasClick);
        renderer.domElement.addEventListener('mousemove', handleCanvasMouseMove);
        renderer.domElement.addEventListener('mouseleave', handleCanvasMouseLeave);

        // ========== ANIMATION LOOP ==========
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.002;
            
            // Gentle floating animation for food objects
            foodMeshes.forEach((mesh, i) => {
                const baseY = foods[i].pos[1];
                const isMilk = foods[i].name.includes('milk');
                mesh.position.y = baseY + (isMilk ? 0.45 : 0) + Math.sin(time + i) * 0.04;
            });
            
            // Keep hover bubble under the hovered food (follows floating animation)
            if (hoveredMesh && hoveredMesh.userData.tooltip && hoveredMesh.userData.tooltip.classList.contains('show')) {
                updateTooltipPositionFromMesh(hoveredMesh.userData.tooltip, hoveredMesh, null);
            }
            
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        // ========== WINDOW RESIZE ==========
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ========== INITIALIZE ==========
        switchToLearnMode(); // Start in Learn Mode
    </script>
</body>
</html>
