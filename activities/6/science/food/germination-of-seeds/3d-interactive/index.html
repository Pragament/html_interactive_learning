<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Germination of Seeds • 3D (Dark, meshy-like)</title>
  <style>
    :root{--brand:#94d36b;--muted:#9aa4ad}
    html,body{height:100%;margin:0}
    body{font-family:Inter,Segoe UI,system-ui,-apple-system,Helvetica,Arial;background:#080808;color:#eef1f3}
    #page{width:100%;height:100%;margin:0;position:relative}

    .panel{position:absolute;left:18px;top:18px;background:rgba(255,255,255,0.03);border-radius:10px;padding:12px;color:#dfe7ea;z-index:40;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.03)}
    .panel h1{margin:0;font-size:1.05rem}
    .panel p.lede{color:var(--muted);margin-top:6px;font-size:0.9rem}
    .controls{display:flex;gap:8px;margin-top:10px}
    .btn{border:none;padding:6px 10px;border-radius:999px;background:transparent;color:var(--brand);cursor:pointer}
    .btn.primary{background:linear-gradient(180deg,#7dd25f,#5fae3d);color:#05120a}

    #canvas-wrap{position:absolute;inset:0;display:block}
    #canvas-container{position:absolute;inset:0;background:radial-gradient(circle at 35% 48%, #30343b 0%, #121315 44%, #050506 100%)}

    /* label style for dark background */
    .label-root{display:none}

    @media(max-width:900px){.panel{left:12px;top:12px}}
  </style>
<script type="application/json" id="activity-metadata">
{
  "schemaVersion": 1,
  "id": "6-science-food-germination-of-seeds-3d-interactive",
  "order": 302,
  "class": "VI",
  "subject": "Science",
  "topic": "Food",
  "subtopic": "Germination of Seeds",
  "title": "Germination of Seeds — 3D Interactive",
  "description": "Soak dry whole seeds of gram or moong in water for a day. Drain excess water and cover seeds with wet cotton cloth. Keep moist for 2-3 days. Observe daily for the emergence of a white structure (root) and later a shoot.",
  "activityType": "simulation",
  "status": "active"
}
</script>
</head>
<body>
  <div id="page">
    <div class="panel">
      <h1>🪴 Germination (Dark)</h1>
      <p class="lede">A refined, dark-scene visualization inspired by meshy aesthetics — spotlight, soft bloom, and organic materials.</p>
      <div class="controls">
        <button id="play" class="btn primary">▶ Play</button>
        <button id="pause" class="btn">⏸ Pause</button>
        <button id="reset" class="btn">⟲ Reset</button>
      </div>
      <div style="margin-top:8px">
        <input id="timeline" type="range" min="0" max="3" step="0.01" value="0" style="width:220px">
        <div style="font-size:0.85rem;color:var(--muted);margin-top:6px">Day <span id="day">0.00</span></div>
        <div style="font-size:0.8rem;color:#c9d3da;margin-top:4px">Phase: <span id="phase">Dry seed</span></div>
      </div>
    </div>

    <div id="canvas-wrap"><div id="canvas-container"></div></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // DOM
    const container = document.getElementById('canvas-container');
    const timeline = document.getElementById('timeline');
    const dayLabel = document.getElementById('day');
    const phaseLabel = document.getElementById('phase');
    const playBtn = document.getElementById('play');
    const pauseBtn = document.getElementById('pause');
    const resetBtn = document.getElementById('reset');

    // scene + camera + renderer (transparent so CSS gradient shows)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(0.06, 0.5, 1.48);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.localClippingEnabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // composer + bloom (stronger, subtle)
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.35, 0.45, 0.95);
    bloom.threshold = 0.05;
    bloom.strength = 0.22;
    bloom.radius = 0.42;
    composer.addPass(bloom);

    // label renderer
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    container.appendChild(labelRenderer.domElement);

    // controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08; controls.target.set(0,0.2,0);

    // lights: reference-style studio light from above
    const spot = new THREE.SpotLight(0xfff7db, 2.0, 6, Math.PI/5, 0.58, 1);
    spot.position.set(0.15, 2.1, 0.55); spot.castShadow = true;
    spot.shadow.mapSize.set(2048,2048); spot.penumbra = 0.6; scene.add(spot);

    const fill = new THREE.HemisphereLight(0x41474f, 0x101214, 0.28); scene.add(fill);

    // subtle rim light
    const rim = new THREE.DirectionalLight(0xffffff, 0.22); rim.position.set(-1,0.7,-0.55); scene.add(rim);

    // full soil bed across the scene (not a small patch)
    function makeSoilTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      if (!ctx) return null;
      ctx.fillStyle = '#3f2a1d';
      ctx.fillRect(0, 0, c.width, c.height);
      for (let i = 0; i < 7000; i++) {
        const x = Math.random() * c.width;
        const y = Math.random() * c.height;
        const r = Math.random() * 1.7 + 0.4;
        const shade = 40 + Math.floor(Math.random() * 40);
        ctx.fillStyle = `rgb(${shade},${24 + Math.floor(Math.random() * 24)},${12 + Math.floor(Math.random() * 18)})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(10, 10);
      return tex;
    }

    const soilTex = makeSoilTexture();
    const soilTopMat = new THREE.MeshStandardMaterial({
      color: 0x4d3220,
      map: soilTex || null,
      roughness: 1.0,
      metalness: 0.0,
      bumpMap: soilTex || null,
      bumpScale: 0.01
    });
    const soilTopGeo = new THREE.PlaneGeometry(12, 12, 140, 140);
    const soilTopPos = soilTopGeo.attributes.position;
    for (let i = 0; i < soilTopPos.count; i++) {
      const x = soilTopPos.getX(i);
      const z = soilTopPos.getY(i);
      const noise = (Math.sin(x * 1.8) + Math.cos(z * 1.5)) * 0.004 + (Math.random() - 0.5) * 0.0025;
      soilTopPos.setZ(i, noise);
    }
    soilTopGeo.computeVertexNormals();
    const soilTop = new THREE.Mesh(soilTopGeo, soilTopMat);
    soilTop.rotation.x = -Math.PI / 2;
    soilTop.position.set(0, -0.02, -1.2);
    soilTop.receiveShadow = true;
    scene.add(soilTop);

    const soilBodyMat = new THREE.MeshStandardMaterial({
      color: 0x3b2619,
      map: soilTex || null,
      roughness: 0.98,
      metalness: 0.0
    });
    const soilBody = new THREE.Mesh(new THREE.BoxGeometry(12, 2.4, 12), soilBodyMat);
    soilBody.position.set(0, -1.24, -1.2);
    soilBody.receiveShadow = true;
    scene.add(soilBody);

    // organic seed geometry (improved displacement)
    function makeOrganicSphere(radius=0.085){
      const geo = new THREE.SphereGeometry(radius, 128, 64);
      const pos = geo.attributes.position;
      for(let i=0;i<pos.count;i++){
        const vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
        const noise = 0.01 * Math.sin(vx*18.3 + vy*9.1 + vz*6.2) + 0.007 * Math.cos(vx*6.3 + vy*11.7);
        pos.setXYZ(i, vx*(1+noise), vy*(1+noise*0.6), vz*(1+noise));
      }
      geo.computeVertexNormals();
      return geo;
    }

    const seedGroup = new THREE.Group(); seedGroup.position.set(0, -0.28, -0.05); scene.add(seedGroup);

    const seedMat = new THREE.MeshPhysicalMaterial({ color: 0xb3d56b, roughness: 0.58, metalness: 0.0, clearcoat:0.07 });
    const seedLeftGeo = new THREE.SphereGeometry(0.072, 96, 64, 0, Math.PI, 0, Math.PI);
    const seedRightGeo = new THREE.SphereGeometry(0.072, 96, 64, Math.PI, Math.PI, 0, Math.PI);
    const seedLeft = new THREE.Mesh(seedLeftGeo, seedMat);
    const seedRight = new THREE.Mesh(seedRightGeo, seedMat);
    seedLeft.castShadow = true; seedLeft.receiveShadow = true;
    seedRight.castShadow = true; seedRight.receiveShadow = true;
    seedLeft.scale.set(1,0.84,1);
    seedRight.scale.set(1,0.84,1);
    seedGroup.add(seedLeft, seedRight);

    // cotyledon inner
    const innerMat = new THREE.MeshPhysicalMaterial({ color:0xddecb8, roughness:0.74 });
    const inner = new THREE.Mesh(new THREE.SphereGeometry(0.046, 64, 48), innerMat); inner.position.set(0,-0.012,0); inner.scale.set(0.001,0.001,0.001); seedGroup.add(inner);

    // radicle (primary root)
    const rootMat = new THREE.MeshPhysicalMaterial({ color:0xe9dcc1, roughness:0.72, metalness:0.0 });
    const rootGeo = new THREE.CylinderGeometry(0.0065, 0.0028, 0.2, 10, 6, true);
    const root = new THREE.Mesh(rootGeo, rootMat);
    root.castShadow = true;
    root.position.set(0, -0.09, 0);
    root.scale.set(1,0.001,1);
    seedGroup.add(root);
    const rootBranchGeo = new THREE.CylinderGeometry(0.0018, 0.0008, 0.05, 8, 1, true);
    const rootBranchA = new THREE.Mesh(rootBranchGeo, rootMat);
    const rootBranchB = new THREE.Mesh(rootBranchGeo, rootMat);
    rootBranchA.position.set(0.012, -0.2, 0.001);
    rootBranchB.position.set(-0.012, -0.198, -0.001);
    rootBranchA.rotation.z = -0.65;
    rootBranchB.rotation.z = 0.62;
    rootBranchA.scale.set(0.001,0.001,0.001);
    rootBranchB.scale.set(0.001,0.001,0.001);
    seedGroup.add(rootBranchA, rootBranchB);

    // stem
    const stemMat = new THREE.MeshPhysicalMaterial({ color:0xcfcf8b, roughness:0.6, clearcoat:0.08 });
    const stemGeo = new THREE.CylinderGeometry(0.008,0.006,1.0,16,16,true);
    const stem = new THREE.Mesh(stemGeo, stemMat); stem.castShadow=true; stem.position.set(0,0.36,0); stem.scale.set(0.001,0.001,0.001); seedGroup.add(stem);

    // leaves (two symmetric curved planes)
    function makeLeaf(w=0.36,h=0.12,color=0x9fdc7a){
      const geo = new THREE.PlaneGeometry(w,h,16,8);
      // bend vertices to create a curved leaf
      const pos = geo.attributes.position;
      for(let i=0;i<pos.count;i++){
        const x = pos.getX(i), y = pos.getY(i);
        const bend = Math.sin((x/w + 0.5)*Math.PI)*0.12; // curvature across length
        pos.setXYZ(i, x, y + bend, (x/w)*0.02);
      }
      geo.computeVertexNormals();
      const texCanvas = document.createElement('canvas');
      texCanvas.width = 256; texCanvas.height = 128;
      const ctx = texCanvas.getContext('2d');
      if (!ctx) {
        return new THREE.Mesh(
          geo,
          new THREE.MeshStandardMaterial({ color: color, side: THREE.DoubleSide, roughness:0.5, metalness:0.01 })
        );
      }
      const grad = ctx.createLinearGradient(0, 0, 256, 0);
      grad.addColorStop(0, '#b0d96e');
      grad.addColorStop(0.5, '#a6d065');
      grad.addColorStop(1, '#94c85b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 128);
      ctx.strokeStyle = 'rgba(110,140,70,0.55)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 9; i++) {
        const y = 14 + i * 12;
        ctx.beginPath();
        ctx.moveTo(128, 64);
        ctx.quadraticCurveTo(90, y, 40, y - 4);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(128, 64);
        ctx.quadraticCurveTo(166, y, 216, y - 4);
        ctx.stroke();
      }
      const leafTex = new THREE.CanvasTexture(texCanvas);
      leafTex.wrapS = leafTex.wrapT = THREE.ClampToEdgeWrapping;
      const mat = new THREE.MeshStandardMaterial({ color: color, map: leafTex, side: THREE.DoubleSide, roughness:0.5, metalness:0.01 });
      const m = new THREE.Mesh(geo, mat);
      return m;
    }
    const leafA = makeLeaf(0.34,0.13,0xb9dc74); leafA.position.set(0.09,0.64,0); leafA.rotation.set(0,0.6,0.22); leafA.castShadow=true; leafA.scale.set(0.001,0.001,0.001); seedGroup.add(leafA);
    const leafB = makeLeaf(0.34,0.13,0xa7d466); leafB.position.set(-0.1,0.64,0); leafB.rotation.set(0,-0.6,-0.22); leafB.castShadow=true; leafB.scale.set(0.001,0.001,0.001); seedGroup.add(leafB);
    const leafC = makeLeaf(0.24,0.1,0xb5db71); leafC.position.set(0.0,0.72,0); leafC.rotation.set(-0.15,0,0.95); leafC.castShadow=true; leafC.scale.set(0.001,0.001,0.001); seedGroup.add(leafC);
    const leafD = makeLeaf(0.18,0.08,0x9fd065); leafD.position.set(0.02,0.59,0.01); leafD.rotation.set(0.2,0.2,-0.7); leafD.castShadow=true; leafD.scale.set(0.001,0.001,0.001); seedGroup.add(leafD);

    // labels
    function makeLabel(text){ const el = document.createElement('div'); el.className='label-root'; el.innerText=text; return new CSS2DObject(el); }
    const seedLabel = makeLabel('Seed'); seedLabel.position.set(0,0.13,0); seedGroup.add(seedLabel);
    const rootLabel = makeLabel('Radicle'); rootLabel.position.set(0,-0.3,0); rootLabel.element.style.opacity='0'; seedGroup.add(rootLabel);
    const shootLabel = makeLabel('Shoot'); shootLabel.position.set(0,0.72,0); shootLabel.element.style.opacity='0'; seedGroup.add(shootLabel);

    // animation state
    let t=0, target=0, playing=false;
    function setFromT(x){
      // swelling
      const soakProg = clamp(x/1.0, 0, 1);
      const s = 1 + soakProg * 0.12;
      seedLeft.scale.set(s, s*0.84, s);
      seedRight.scale.set(s, s*0.84, s);

      const splitProg = clamp((x-1.0)/0.8, 0, 1);
      const splitGap = 0.004 + splitProg * 0.038;
      seedLeft.position.set(-splitGap, 0, 0);
      seedRight.position.set(splitGap, 0, 0);
      seedLeft.rotation.z = -splitProg * 0.24;
      seedRight.rotation.z = splitProg * 0.24;

      const cotyledonProg = clamp((x-0.9)/0.7, 0, 1);
      const innerScale = 0.001 + cotyledonProg * 0.9;
      inner.scale.set(innerScale, innerScale * 0.9, innerScale);

      // radicle: appears 1.2->2.1
      const rProg = clamp((x-1.15)/0.95,0,1);
      root.scale.set(1, Math.max(0.001, rProg), 1);
      root.position.set(0, -0.07 - (rProg*0.1), 0);
      root.rotation.z = Math.sin(x * 3.2) * 0.08 * rProg;
      rootBranchA.scale.set(Math.max(0.001, rProg), Math.max(0.001, rProg), Math.max(0.001, rProg));
      rootBranchB.scale.set(Math.max(0.001, rProg), Math.max(0.001, rProg), Math.max(0.001, rProg));
      rootLabel.element.style.opacity = `${Math.min(1,rProg*1.2)}`;

      // shoot growth 1.9->3.0
      const sProg = clamp((x-1.75)/1.2,0,1);
      stem.scale.set(1, sProg, 1);
      stem.position.set(0, 0.09 + sProg*0.48, 0);
      leafA.position.y = 0.42 + sProg*0.24; leafB.position.y = 0.42 + sProg*0.24;
      leafC.position.y = 0.5 + sProg*0.22; leafD.position.y = 0.39 + sProg*0.2;
      leafA.scale.set(Math.max(0.001, sProg), Math.max(0.001, sProg), Math.max(0.001, sProg));
      leafB.scale.set(Math.max(0.001, sProg), Math.max(0.001, sProg), Math.max(0.001, sProg));
      const cProg = Math.max(0.001, clamp((sProg - 0.15) / 0.85, 0, 1));
      const dProg = Math.max(0.001, clamp((sProg - 0.25) / 0.75, 0, 1));
      leafC.scale.set(cProg, cProg, cProg);
      leafD.scale.set(dProg, dProg, dProg);
      leafA.rotation.y = 0.2 + sProg * 0.45;
      leafB.rotation.y = -0.2 - sProg * 0.45;
      leafC.rotation.x = -0.28 - sProg * 0.22;
      leafD.rotation.z = -0.8 + sProg * 0.25;
      shootLabel.element.style.opacity = `${Math.min(1,sProg*1.2)}`;

      // whole seedling emerges upward from soil as germination progresses
      const emergeProg = clamp((x-1.05)/1.45, 0, 1);
      seedGroup.position.y = -0.28 + emergeProg * 0.31;

      if (x < 0.9) phaseLabel.textContent = 'Dry seed';
      else if (x < 1.5) phaseLabel.textContent = 'Water absorption & swelling';
      else if (x < 2.2) phaseLabel.textContent = 'Seed coat splitting + radicle';
      else phaseLabel.textContent = 'Shoot and first leaves';

      dayLabel.textContent = x.toFixed(2);
    }
    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

    // UI
    timeline.addEventListener('input', (e)=>{ target = parseFloat(e.target.value); setFromT(target); });
    playBtn.addEventListener('click', ()=>{ playing = true; });
    pauseBtn.addEventListener('click', ()=>{ playing = false; });
    resetBtn.addEventListener('click', ()=>{ playing=false; target=0; timeline.value=0; setFromT(0); });

    // resize
    window.addEventListener('resize', ()=>{ const w=window.innerWidth; const h=window.innerHeight; renderer.setSize(w,h); labelRenderer.setSize(w,h); composer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix(); });

    // animation
    const clock = new THREE.Clock(); function animate(){ const dt=clock.getDelta(); if(playing){ target += dt*0.45; if(target>=3){ target=3; playing=false; } timeline.value = target; } t += (target - t) * Math.min(1, dt*8); seedGroup.rotation.y = 0.0; setFromT(t); controls.update(); composer.render(); labelRenderer.render(scene, camera); requestAnimationFrame(animate); }
    function perfTime(){ return (performance.now()||Date.now())*0.001; }
    animate();

  </script>
</body>
</html>
