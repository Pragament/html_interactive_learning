<body>
    <header>
        <h1><span>Fraction Kitchen Scale</span><span class="badge">Class 6 Maths</span></h1>
        <div class="nav-btns">
            <button class="btn active" id="btn-scale-free" onclick="setScaleMode('free')">Free Balance</button>
            <button class="btn" id="btn-scale-buster" onclick="setScaleMode('buster')">Misconception Buster</button>
        </div>
    </header>
    <div class="container">
        <div class="work-area">
            <div class="scale-box">
                <div class="scale-stand"></div>
                <div class="scale-base"></div>
                <div class="scale-pivot"></div>
                <div class="scale-beam" id="beam">
                    <div class="pan-left-anchor">
                        <div class="pan-string" style="left: 65px;"></div>
                        <div class="pan" id="left-pan" style="left: 0;"></div>
                    </div>
                    <div class="pan-right-anchor">
                        <div class="pan-string" style="right: 65px;"></div>
                        <div class="pan" id="right-pan" style="right: 0;"></div>
                    </div>
                </div>
            </div>
            <div class="weight-shelf">
                <span style="font-size: 0.8rem; font-weight: 600; color: #cbd5e1; align-self: center;">Left Pan:</span>
                <button class="shelf-btn" onclick="addWeight('left', 1, 2)">1/2</button>
                <button class="shelf-btn" onclick="addWeight('left', 1, 3)">1/3</button>
                <button class="shelf-btn" onclick="addWeight('left', 1, 4)">1/4</button>
                <button class="shelf-btn" onclick="addWeight('left', 1, 6)">1/6</button>
            </div>
            <div class="weight-shelf" style="margin-top: 8px;">
                <span style="font-size: 0.8rem; font-weight: 600; color: #cbd5e1; align-self: center;">Right Pan:</span>
                <button class="shelf-btn" style="background:#10b981;" onclick="addWeight('right', 1, 2)">1/2</button>
                <button class="shelf-btn" style="background:#10b981;" onclick="addWeight('right', 1, 3)">1/3</button>
                <button class="shelf-btn" style="background:#10b981;" onclick="addWeight('right', 1, 4)">1/4</button>
                <button class="shelf-btn" style="background:#10b981;" onclick="addWeight('right', 1, 6)">1/6</button>
            </div>
            <button class="btn btn-danger" style="margin-top: 15px;" onclick="clearWeights()">Reset Scale</button>
        </div>
        <div class="sidebar">
            <div class="card">
                <div class="card-title">Scale Comparison</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <div style="font-size:0.75rem; color:#94a3b8; text-align:center;">Left</div>
                        <div class="readout" id="left-fraction-txt">0</div>
                    </div>
                    <div>
                        <div style="font-size:0.75rem; color:#94a3b8; text-align:center;">Right</div>
                        <div class="readout" id="right-fraction-txt">0</div>
                    </div>
                </div>
                <div class="balance-status balanced" id="status-badge">Balanced at 0</div>
            </div>
            <div class="card">
                <div class="card-title">Visual Fraction Bar</div>
                <div class="visual-bar" id="left-bar"></div>
                <div class="visual-bar" id="right-bar" style="margin-top: 4px;"></div>
            </div>
            <div class="card" id="buster-card" style="display:none; border-color: #ef4444;">
                <div class="card-title" style="color: #ef4444;">Misconception Demo</div>
                <p style="font-size: 0.8rem; color: #cbd5e1; line-height: 1.4;">
                    <strong>Myth:</strong> "1/2 + 1/3 = 2/5"<br>
                    Notice how 1/2 + 1/3 (0.833) easily outweighs 2/5 (0.400). Adding denominators is false!
                </p>
            </div>
        </div>
    </div>
    <script>
        let leftItems = [], rightItems = [];
        function addWeight(pan, num, den) {
            if (pan === 'left') leftItems.push({ num, den });
            else rightItems.push({ num, den });
            updateScale();
        }
        function clearWeights() { leftItems = []; rightItems = []; updateScale(); }
        function sumPan(items) { return items.reduce((acc, item) => acc + (item.num / item.den), 0); }
        function updateScale() {
            const leftSum = sumPan(leftItems), rightSum = sumPan(rightItems);
            let angle = Math.max(-16, Math.min(16, (rightSum - leftSum) * 30));
            document.getElementById('beam').style.transform = 'rotate(' + angle + 'deg)';
            renderPan('left-pan', leftItems); renderPan('right-pan', rightItems);
            document.getElementById('left-fraction-txt').innerText = leftSum === 0 ? '0' : leftSum.toFixed(3);
            document.getElementById('right-fraction-txt').innerText = rightSum === 0 ? '0' : rightSum.toFixed(3);
            const statusEl = document.getElementById('status-badge');
            if (Math.abs(leftSum - rightSum) < 0.001) {
                statusEl.className = 'balance-status balanced';
                statusEl.innerText = leftSum === 0 ? 'Balanced at 0' : 'Balanced (=)';
            } else if (leftSum > rightSum) {
                statusEl.className = 'balance-status unbalanced';
                statusEl.innerText = 'Left is Heavier (>)';
            } else {
                statusEl.className = 'balance-status unbalanced';
                statusEl.innerText = 'Right is Heavier (<)';
            }
            renderBar('left-bar', leftSum); renderBar('right-bar', rightSum);
        }
        function renderPan(panId, items) {
            const el = document.getElementById(panId); el.innerHTML = '';
            items.forEach((item, idx) => {
                const d = document.createElement('div'); d.className = 'weight-item';
                d.innerText = item.num + '/' + item.den;
                d.onclick = () => { items.splice(idx, 1); updateScale(); };
                el.appendChild(d);
            });
        }
        function renderBar(barId, sum) {
            const el = document.getElementById(barId); el.innerHTML = '';
            const pct = Math.min(100, (sum / 2) * 100);
            const seg = document.createElement('div'); seg.className = 'bar-seg'; seg.style.width = pct + '%';
            el.appendChild(seg);
        }
        function setScaleMode(mode) {
            document.getElementById('btn-scale-free').classList.toggle('active', mode === 'free');
            document.getElementById('btn-scale-buster').classList.toggle('active', mode === 'buster');
            document.getElementById('buster-card').style.display = (mode === 'buster') ? 'block' : 'none';
            if (mode === 'buster') {
                leftItems = [{ num: 1, den: 2 }, { num: 1, den: 3 }];
                rightItems = [{ num: 2, den: 5 }];
                updateScale();
            } else clearWeights();
        }
        updateScale();
    </script>
