<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class VI: Even and Odd Numbers - Pebble Sharing Game</title>
  <style>
    /* ==========================================================================
       PURE CSS - 100% MOBILE-FRIENDLY & RESPONSIVE (ZERO EXTERNAL CDNs)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
      max-width: 560px;
      width: 100%;
      padding: 22px;
      margin: auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
    }

    .header-text {
      flex: 1;
    }

    .badge {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-top: 3px;
    }

    /* Counter Controls - Touch Sized */
    .counter-box {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      padding: 3px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      flex-shrink: 0;
    }

    .counter-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      touch-action: manipulation;
      transition: background 0.15s, transform 0.1s;
    }

    .counter-btn:active {
      background: #e2e8f0;
      transform: scale(0.95);
    }

    .counter-val {
      width: 36px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
    }

    /* Presets with touch scrolling */
    .presets {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 14px 0;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .presets::-webkit-scrollbar {
      display: none;
    }

    .preset-label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      white-space: nowrap;
    }

    .preset-btn {
      padding: 6px 12px;
      border-radius: 9px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
      transition: background 0.15s;
    }

    .preset-btn:active {
      background: #e2e8f0;
    }

    .preset-random {
      background: #eef2ff;
      border-color: #c7d2fe;
      color: #4f46e5;
      font-weight: 700;
    }

    /* Game Arena - Desktop: 3 columns */
    .arena {
      display: grid;
      grid-template-columns: 1fr 0.9fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .bowl-card {
      border-radius: 16px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 160px;
      transition: all 0.2s;
    }

    .bowl-anya {
      background: #f0f9ff;
      border: 2px solid #bae6fd;
    }

    .bowl-center {
      background: #f8fafc;
      border: 2px dashed #94a3b8;
    }

    .bowl-kabir {
      background: #fffbeb;
      border: 2px solid #fde68a;
    }

    .bowl-title {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .bowl-anya .bowl-title { color: #0284c7; }
    .bowl-center .bowl-title { color: #64748b; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
    .bowl-kabir .bowl-title { color: #d97706; }

    /* Pebbles collection trays */
    .tray {
      width: 100%;
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
      margin: 8px 0;
      border-radius: 12px;
    }

    .tray-inner {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    /* Pebble Graphic */
    .pebble {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      box-shadow: inset -2px -2px 3px rgba(0,0,0,0.3), 1px 2px 3px rgba(0,0,0,0.15);
      display: inline-block;
      transition: transform 0.2s;
    }

    .pebble-center {
      background: radial-gradient(circle at 35% 35%, #94a3b8, #475569);
    }

    .pebble-anya {
      background: radial-gradient(circle at 35% 35%, #38bdf8, #0284c7);
    }

    .pebble-kabir {
      background: radial-gradient(circle at 35% 35%, #fbbf24, #d97706);
    }

    .bowl-count {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
    }

    .bowl-count strong {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
    }

    /* Result Banner */
    .result-card {
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      transition: all 0.3s;
    }

    .result-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .result-icon {
      font-size: 24px;
      flex-shrink: 0;
    }

    .result-title {
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1.3;
    }

    .result-subtitle {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
      line-height: 1.3;
    }

    .badge-result {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 6px 10px;
      border-radius: 8px;
      white-space: nowrap;
      display: none;
      flex-shrink: 0;
    }

    .even-mode {
      background: #f0fdf4 !important;
      border-color: #86efac !important;
    }
    .even-mode .result-title { color: #166534; }
    .even-badge {
      background: #16a34a;
      color: #ffffff;
      display: inline-block !important;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
    }

    .odd-mode {
      background: #fef2f2 !important;
      border-color: #fca5a5 !important;
    }
    .odd-mode .result-title { color: #991b1b; }
    .odd-badge {
      background: #dc2626;
      color: #ffffff;
      display: inline-block !important;
      box-shadow: 0 2px 6px rgba(220, 38, 38, 0.3);
    }

    /* Actions - Touch Sized */
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }

    .btn {
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      touch-action: manipulation;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-reset {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #475569;
    }

    .btn-step {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #4f46e5;
    }

    .btn-auto {
      background: #4f46e5;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* ==========================================================================
       MOBILE RESPONSIVE MEDIA QUERIES (HANDPHONES & PHABLETS)
       ========================================================================== */
    @media (max-width: 480px) {
      body {
        padding: 8px;
      }

      .card {
        padding: 16px 14px;
        border-radius: 16px;
      }

      h1 {
        font-size: 17px;
      }

      /* On mobile, place Center Bowl on top, and Child A & B side-by-side below */
      .arena {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "center center"
          "anya   kabir";
        gap: 8px;
      }

      .bowl-center {
        grid-area: center;
        min-height: 100px;
        flex-direction: row;
        padding: 8px 12px;
      }

      .bowl-center .tray {
        max-width: 170px;
        margin: 0;
      }

      .bowl-anya {
        grid-area: anya;
        min-height: 140px;
      }

      .bowl-kabir {
        grid-area: kabir;
        min-height: 140px;
      }

      /* Stack action buttons cleanly for thumbs */
      .actions {
        flex-direction: column;
        gap: 8px;
      }

      .btn-reset {
        width: 100%;
        order: 2;
      }

      .actions-main {
        width: 100%;
        display: flex;
        gap: 8px;
        order: 1;
      }

      .actions-main .btn {
        flex: 1;
      }

      .result-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .badge-result {
        align-self: flex-start;
        margin-top: 4px;
      }
    }

    @media (max-width: 350px) {
      .actions-main {
        flex-direction: column;
      }
    }
  </style>
<script type="application/json" id="activity-metadata">
{
  "schemaVersion": 1,
  "id": "6-mathematics-number-system-even-and-odd",
  "order": 204,
  "class": "VI",
  "subject": "Mathematics",
  "topic": "Number System",
  "subtopic": null,
  "title": "Even and Odd Numbers",
  "description": "Two children pick pebbles turn by turn. Check if any pebble is left after equal distribution.",
  "activityType": "exploration",
  "status": "active"
}
</script>
</head>
<body>

  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="header-text">
        <div class="badge">Class VI Mathematics</div>
        <h1>Even and Odd Numbers</h1>
        <p class="subtitle">Two children share pebbles turn by turn from a central bowl</p>
      </div>

      <!-- Pebble selector -->
      <div class="counter-box">
        <button class="counter-btn" onclick="changeCount(-1)" title="Decrease pebbles">－</button>
        <div id="target-count" class="counter-val">7</div>
        <button class="counter-btn" onclick="changeCount(1)" title="Increase pebbles">＋</button>
      </div>
    </div>

    <!-- Quick Presets with Touch Scroll -->
    <div class="presets">
      <span class="preset-label">Presets:</span>
      <button class="preset-btn" onclick="selectCount(6)">6 (Even)</button>
      <button class="preset-btn" onclick="selectCount(7)">7 (Odd)</button>
      <button class="preset-btn" onclick="selectCount(10)">10 (Even)</button>
      <button class="preset-btn" onclick="selectCount(11)">11 (Odd)</button>
      <button class="preset-btn" onclick="selectCount(14)">14 (Even)</button>
      <button class="preset-btn" onclick="selectCount(15)">15 (Odd)</button>
      <button class="preset-btn preset-random" onclick="selectRandom()">🎲 Random</button>
    </div>

    <!-- Game Arena (Responsive Layout) -->
    <div class="arena">
      <!-- Child A: Anya -->
      <div class="bowl-card bowl-anya">
        <div class="bowl-title">
          <span>👧</span>
          <span>Anya (Child A)</span>
        </div>
        <div id="anya-tray" class="tray tray-inner"></div>
        <div class="bowl-count">Pebbles: <strong id="anya-count">0</strong></div>
      </div>

      <!-- Center Pile -->
      <div class="bowl-card bowl-center">
        <div class="bowl-title">Center Bowl</div>
        <div id="center-tray" class="tray"></div>
        <div class="bowl-count">In Bowl: <strong id="center-count">7</strong></div>
      </div>

      <!-- Child B: Kabir -->
      <div class="bowl-card bowl-kabir">
        <div class="bowl-title">
          <span>👦</span>
          <span>Kabir (Child B)</span>
        </div>
        <div id="kabir-tray" class="tray tray-inner"></div>
        <div class="bowl-count">Pebbles: <strong id="kabir-count">0</strong></div>
      </div>
    </div>

    <!-- Result / Status Card -->
    <div id="result-card" class="result-card">
      <div class="result-left">
        <div id="result-icon" class="result-icon">⚖️</div>
        <div>
          <div id="result-title" class="result-title">Ready to share pebbles</div>
          <div id="result-subtitle" class="result-subtitle">Click "Pick 1 Turn" or "Auto Share All ⚡"</div>
        </div>
      </div>
      <div id="result-badge" class="badge-result"></div>
    </div>

    <!-- Actions (Touch Friendly) -->
    <div class="actions">
      <button class="btn btn-reset" onclick="resetDistribution()">↺ Reset</button>
      <div class="actions-main" style="display: flex; gap: 8px;">
        <button id="btn-step" class="btn btn-step" onclick="distributeRound()">Pick 1 Turn (Pair)</button>
        <button id="btn-auto" class="btn btn-auto" onclick="distributeAll()">Auto Share All ⚡</button>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       VANILLA JAVASCRIPT LOGIC & AUDIO SYNTHESIS
       ========================================================================== */
    let totalPebbles = 7;
    let anyaPebbles = 0;
    let kabirPebbles = 0;
    let centerRemaining = 7;
    let isAutoRunning = false;

    // Browser audio synthesizer for tactile sound clicks
    let audioCtx = null;
    function playTone(freq = 440) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.4, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
      } catch (e) {}
    }

    // DOM References
    const anyaTray = document.getElementById('anya-tray');
    const kabirTray = document.getElementById('kabir-tray');
    const centerTray = document.getElementById('center-tray');

    const anyaCountLabel = document.getElementById('anya-count');
    const kabirCountLabel = document.getElementById('kabir-count');
    const centerCountLabel = document.getElementById('center-count');
    const targetCountLabel = document.getElementById('target-count');

    const resultCard = document.getElementById('result-card');
    const resultIcon = document.getElementById('result-icon');
    const resultTitle = document.getElementById('result-title');
    const resultSubtitle = document.getElementById('result-subtitle');
    const resultBadge = document.getElementById('result-badge');

    const btnStep = document.getElementById('btn-step');
    const btnAuto = document.getElementById('btn-auto');

    function createPebble(typeClass) {
      const el = document.createElement('div');
      el.className = `pebble ${typeClass}`;
      return el;
    }

    function renderUI() {
      targetCountLabel.textContent = totalPebbles;
      anyaCountLabel.textContent = anyaPebbles;
      kabirCountLabel.textContent = kabirPebbles;
      centerCountLabel.textContent = centerRemaining;

      // Render center pebbles
      centerTray.innerHTML = '';
      for (let i = 0; i < centerRemaining; i++) {
        centerTray.appendChild(createPebble('pebble-center'));
      }

      // Render Anya's pebbles
      anyaTray.innerHTML = '';
      for (let i = 0; i < anyaPebbles; i++) {
        anyaTray.appendChild(createPebble('pebble-anya'));
      }

      // Render Kabir's pebbles
      kabirTray.innerHTML = '';
      for (let i = 0; i < kabirPebbles; i++) {
        kabirTray.appendChild(createPebble('pebble-kabir'));
      }

      // Check if finished
      if (centerRemaining === 0) {
        btnStep.disabled = true;
        btnAuto.disabled = true;

        if (anyaPebbles === kabirPebbles) {
          // EVEN NUMBER
          resultCard.className = 'result-card even-mode';
          resultIcon.textContent = '🎉';
          resultTitle.textContent = `Equal Share! Both got ${anyaPebbles} pebbles each.`;
          resultSubtitle.textContent = `Formula: ${totalPebbles} = (2 × ${anyaPebbles}) + 0 leftover. Remainder = 0.`;
          resultBadge.className = 'badge-result even-badge';
          resultBadge.textContent = 'EVEN NUMBER';
          playTone(600);
        } else {
          // ODD NUMBER
          resultCard.className = 'result-card odd-mode';
          resultIcon.textContent = '⚠️';
          resultTitle.textContent = `Unequal! 1 pebble was left without a pair.`;
          resultSubtitle.textContent = `Anya: ${anyaPebbles}, Kabir: ${kabirPebbles}. Formula: ${totalPebbles} = (2 × ${kabirPebbles}) + 1. Remainder = 1.`;
          resultBadge.className = 'badge-result odd-badge';
          resultBadge.textContent = 'ODD NUMBER';
          playTone(280);
        }
      } else {
        btnStep.disabled = false;
        btnAuto.disabled = false;
        resultCard.className = 'result-card';
        resultBadge.style.display = 'none';
        resultIcon.textContent = '⚖️';
        resultTitle.textContent = `Sharing in progress (${centerRemaining} pebbles left)`;
        resultSubtitle.textContent = `Anya has ${anyaPebbles} • Kabir has ${kabirPebbles}`;
      }
    }

    function selectCount(n) {
      totalPebbles = Math.max(1, Math.min(24, n));
      resetDistribution();
    }

    function changeCount(delta) {
      selectCount(totalPebbles + delta);
    }

    function selectRandom() {
      selectCount(Math.floor(Math.random() * 18) + 3);
    }

    function resetDistribution() {
      anyaPebbles = 0;
      kabirPebbles = 0;
      centerRemaining = totalPebbles;
      renderUI();
    }

    function distributeRound() {
      if (centerRemaining <= 0) return;

      if (centerRemaining >= 2) {
        anyaPebbles += 1;
        kabirPebbles += 1;
        centerRemaining -= 2;
        playTone(480);
      } else if (centerRemaining === 1) {
        anyaPebbles += 1;
        centerRemaining -= 1;
        playTone(320);
      }
      renderUI();
    }

    async function distributeAll() {
      if (isAutoRunning) return;
      isAutoRunning = true;
      resetDistribution();

      while (centerRemaining > 0) {
        await new Promise(resolve => setTimeout(resolve, 280));
        distributeRound();
      }
      isAutoRunning = false;
    }

    // Initial run
    resetDistribution();
  </script>
</body>
</html>
