    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.2rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            font-size: 0.75rem;
            background: #0284c7;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .nav-btns {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: #334155;
            color: white;
            border: 1px solid #475569;

        }

        .btn:hover {

        }

        .btn.active {
            background: #0284c7;
            border-color: #38bdf8;
        }

        .btn-green {
            background: #10b981;
            border-color: #059669;
        }

        .container {
            flex: 1;

        @media (min-width: 900px) {
            .container {
                flex-direction: row;
            }
        }

        .grid-panel {
            flex: 1;
            position: relative;
            background: #020617;
            min-height: 440px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .sidebar {
            width: 100%;
            max-width: 380px;
            background: #1e293b;
            border-left: 1px solid #334155;
            padding: 16px;

        }

        .coord-display {

        }

        .rule-box {
            font-family: monospace;
            font-size: 0.8rem;
            background: #000;

            color: #e2e8f0;

</head>

<body>
    <header>
        <h1><span>Coordinate Rover Navigator</span><span class="badge">Class 9 Maths</span></h1>
        <div class="nav-btns">
            <button class="btn active" id="btn-rover-sandbox" onclick="setRoverMode('sandbox')">Sandbox Pilot</button>
            <button class="btn" id="btn-rover-mission" onclick="setRoverMode('mission')">Beacon Mission</button>
        </div>
    </header>
    <div class="container">
        <div class="grid-panel" id="grid-container">
            <canvas id="grid-canvas"></canvas>
        </div>
        <div class="sidebar">
            <div class="card">
                <div class="card-title">Rover Position (x, y)</div>
                <div class="coord-display" id="rover-pos">(2, 3)</div>
                <div style="font-size:0.75rem; color:#94a3b8; text-align:center; margin-top:4px;" id="rover-quadrant">
                    Quadrant I</div>
            </div>

            <div class="card">
                <div class="card-title">Transformations Console</div>
                <div class="action-grid">
                    <button class="act-btn" onclick="transform('reflectX')">Reflect X-Axis<br><small>(x,
                            -y)</small></button>
                    <button class="act-btn" onclick="transform('reflectY')">Reflect Y-Axis<br><small>(-x,
                            y)</small></button>
                    <button class="act-btn" onclick="transform('reflectYX')">Reflect y = x<br><small>(y,
                            x)</small></button>
                    <button class="act-btn" onclick="transform('rot90')">Rotate 90° CW<br><small>(y,
                            -x)</small></button>
                    <button class="act-btn" onclick="transform('rot180')">Rotate 180°<br><small>(-x,
                            -y)</small></button>
                    <button class="act-btn" onclick="resetRover()">Reset (0,0)</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Translate Vector (Δx, Δy)</div>
                <div style="display:flex; gap:8px;">
                    <input type="number" id="dx" value="1"
                        style="width:50%; background:#1e293b; color:white; border:1px solid #475569; padding:6px; border-radius:6px;">
                    <input type="number" id="dy" value="1"
                        style="width:50%; background:#1e293b; color:white; border:1px solid #475569; padding:6px; border-radius:6px;">
                </div>
                <button class="btn btn-green" style="width:100%; margin-top:8px;" onclick="applyTranslation()">Apply
                    (x+Δx, y+Δy)</button>
            </div>

            <div class="card">
                <div class="card-title">Last Transformation Rule</div>
                <div class="rule-box" id="rule-display">Initial position set to (2, 3).</div>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('grid-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('grid-container');
        let rover = { x: 2, y: 3 };
        let trail = [{ x: 2, y: 3 }];
        let beacon = { x: -4, y: 3, collected: false };
        let mode = 'sandbox';

        function resize() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            draw();
        }
        window.addEventListener('resize', resize);

        function transform(type) {
            const oldX = rover.x, oldY = rover.y;
            let ruleStr = '';
            if (type === 'reflectX') {
                rover.y = -rover.y;
                ruleStr = 'Reflection across X-axis: (x, y) -> (x, -y)\n(' + oldX + ', ' + oldY + ') -> (' + rover.x + ', ' + rover.y + ')';
            } else if (type === 'reflectY') {
                rover.x = -rover.x;
                ruleStr = 'Reflection across Y-axis: (x, y) -> (-x, y)\n(' + oldX + ', ' + oldY + ') -> (' + rover.x + ', ' + rover.y + ')';
            } else if (type === 'reflectYX') {
                let temp = rover.x; rover.x = rover.y; rover.y = temp;
                ruleStr = 'Reflection across y=x: (x, y) -> (y, x)\n(' + oldX + ', ' + oldY + ') -> (' + rover.x + ', ' + rover.y + ')';
            } else if (type === 'rot90') {
                let temp = rover.x; rover.x = rover.y; rover.y = -temp;
                ruleStr = 'Rotation 90° CW: (x, y) -> (y, -x)\n(' + oldX + ', ' + oldY + ') -> (' + rover.x + ', ' + rover.y + ')';
            } else if (type === 'rot180') {
                rover.x = -rover.x; rover.y = -rover.y;
                ruleStr = 'Rotation 180°: (x, y) -> (-x, -y)\n(' + oldX + ', ' + oldY + ') -> (' + rover.x + ', ' + rover.y + ')';
            }
            trail.push({ x: rover.x, y: rover.y });
            document.getElementById('rule-display').innerText = ruleStr;
            updateUI();
            draw();
        }

        function applyTranslation() {
            const dx = parseInt(document.getElementById('dx').value) || 0;
            const dy = parseInt(document.getElementById('dy').value) || 0;
            const oldX = rover.x, oldY = rover.y;
            rover.x += dx; rover.y += dy;
            trail.push({ x: rover.x, y: rover.y });
            document.getElementById('rule-display').innerText = 'Translation <' + dx + ', ' + dy + '>:\n(' + oldX + ', ' + oldY + ') -> (' + rover.x + ', ' + rover.y + ')';
            updateUI();
            draw();
        }

        function resetRover() {
            rover = { x: 0, y: 0 };
            trail = [{ x: 0, y: 0 }];
            document.getElementById('rule-display').innerText = 'Reset to origin (0, 0)';
            updateUI();
            draw();
        }

        function updateUI() {
            document.getElementById('rover-pos').innerText = '(' + rover.x + ', ' + rover.y + ')';
            let q = '';
            if (rover.x > 0 && rover.y > 0) q = 'Quadrant I (+, +)';
            else if (rover.x < 0 && rover.y > 0) q = 'Quadrant II (-, +)';
            else if (rover.x < 0 && rover.y < 0) q = 'Quadrant III (-, -)';
            else if (rover.x > 0 && rover.y < 0) q = 'Quadrant IV (+, -)';
            else if (rover.x === 0 && rover.y === 0) q = 'Origin (0,0)';
            else q = 'On Axis';
            document.getElementById('rover-quadrant').innerText = q;

            if (mode === 'mission' && rover.x === beacon.x && rover.y === beacon.y) {
                beacon.collected = true;
                document.getElementById('rule-display').innerText = 'Mission Accomplished! Beacon collected at (' + beacon.x + ', ' + beacon.y + ')!';
            }
        }

        function toScreen(gx, gy) {
            const midX = canvas.width / 2;
            const midY = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) / 22;
            return { x: midX + gx * scale, y: midY - gy * scale };
        }

        function draw() {
            if (!canvas.width || !canvas.height) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const midX = canvas.width / 2, midY = canvas.height / 2;
            const scale = Math.min(canvas.width, canvas.height) / 22;

            // Grid
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            for (let i = -10; i <= 10; i++) {
                const ptX = midX + i * scale;
                ctx.beginPath(); ctx.moveTo(ptX, 0); ctx.lineTo(ptX, canvas.height); ctx.stroke();
                const ptY = midY - i * scale;
                ctx.beginPath(); ctx.moveTo(0, ptY); ctx.lineTo(canvas.width, ptY); ctx.stroke();
            }

            // Axes
            ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(midX, 0); ctx.lineTo(midX, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(canvas.width, midY); ctx.stroke();

            // Axis Numbers
            ctx.fillStyle = '#94a3b8'; ctx.font = '10px monospace';
            for (let i = -10; i <= 10; i += 2) {
                if (i === 0) continue;
                const pt = toScreen(i, 0);
                ctx.fillText(i, pt.x - 6, pt.y + 14);
                const ptY = toScreen(0, i);
                ctx.fillText(i, ptY.x + 6, ptY.y + 4);
            }

            // Motion Trail
            if (trail.length > 1) {
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
                ctx.beginPath();
                const p0 = toScreen(trail[0].x, trail[0].y);
                ctx.moveTo(p0.x, p0.y);
                for (let i = 1; i < trail.length; i++) {
                    const p = toScreen(trail[i].x, trail[i].y);
                    ctx.lineTo(p.x, p.y);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Beacon
            if (mode === 'mission' && !beacon.collected) {
                const bp = toScreen(beacon.x, beacon.y);
                ctx.fillStyle = '#eab308';
                ctx.beginPath(); ctx.arc(bp.x, bp.y, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff'; ctx.font = '10px sans-serif';
                ctx.fillText('★', bp.x - 4, bp.y + 3);
            }

            // Rover
            const rp = toScreen(rover.x, rover.y);
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(rp.x, rp.y, 8, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(rp.x, rp.y, 12, 0, Math.PI * 2); ctx.stroke();
        }

        function setRoverMode(m) {
            mode = m;
            document.getElementById('btn-rover-sandbox').classList.toggle('active', m === 'sandbox');
            document.getElementById('btn-rover-mission').classList.toggle('active', m === 'mission');
            if (m === 'mission') {
                beacon = { x: -4, y: 3, collected: false };
                document.getElementById('rule-display').innerText = 'Mission: Guide Rover to the Beacon at (-4, 3) using reflections and rotations!';
            }
            draw();
        }

        setTimeout(resize, 50);
    </script>
</body>

</html>
