    <style>

<body>

    <header>
        <h1>
            <span>Geometry Lab</span>
            <span class="badge">IX-X</span>
        </h1>
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-explore" onclick="setMode('explore')">Explore</button>
            <button class="mode-btn" id="btn-proof" onclick="setMode('proof')">Proof Steps</button>

        </div>
    </header>

    <div class="main-container">
        <div class="canvas-container" id="canvas-holder">
            <canvas id="geoCanvas"></canvas>
            <div id="toast" class="toast">Drag points A, B to test theorem</div>
        </div>

        <div class="control-panel">
            <!-- Dynamic Instructions -->
            <div class="card">
                <div class="card-title" id="panel-title">Task Instruction</div>
                <div class="instruction-box" id="instruction-text">
                    Drag the handles on the circle (A or B) to adjust the chord. Notice how the perpendicular segment (OM) impacts chord lengths AM and MB.
                </div>
            </div>

            <!-- Dynamic Measurement / Data Box -->
            <div class="card" id="data-card">
                <div class="card-title">Live Measurements</div>
                <div class="measurements-grid">
                    <div class="metric">
                        <div class="metric-label">AM</div>
                        <div class="metric-value" style="color: var(--accent-green);" id="val-am">0.0</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">MB</div>
                        <div class="metric-value" style="color: var(--accent-orange);" id="val-mb">0.0</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">∠OMA</div>
                        <div class="metric-value" style="color: var(--accent-blue);" id="val-angle">90°</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">AM = MB?</div>
                        <div class="metric-value" style="color: var(--accent-purple);" id="val-equal">Yes</div>
                    </div>
                </div>
            </div>

            <!-- Controls Panel -->
            <div class="card" id="control-card">
                <div class="card-title">Visual Aids</div>
                <div class="toggle-group">
                    <button class="toggle-btn active" id="tog-perp" onclick="togglePerp()">
                        <span>Perpendicular (OM)</span>
                        <div class="checkbox"></div>
                    </button>
                    <button class="toggle-btn" id="tog-radii" onclick="toggleRadii()">
                        <span>Triangles (Radii OA & OB)</span>
                        <div class="checkbox"></div>
                    </button>
                    <button class="toggle-btn" id="tog-bisect" onclick="toggleBisectMode()">
                        <span>Converse: Midpoint to Centre</span>
                        <div class="checkbox"></div>
                    </button>
                </div>
            </div>

            <!-- Interactive Proof/Quiz Area -->
            <div class="card" id="interactive-card" style="display: none;">
                <div class="card-title" id="interactive-title">Interactive Module</div>
                <div id="interactive-content"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('geoCanvas');
        const ctx = canvas.getContext('2d');
        const canvasHolder = document.getElementById('canvas-holder');

        // State Variables
        let width = 0, height = 0;
        let mode = 'explore';
        
        // Geometry Properties
        let center = { x: 0, y: 0 };
        let radius = 120;
        let angleA = 210 * (Math.PI / 180);
        let angleB = 330 * (Math.PI / 180);
        
        // Calculated Points
        let pointA = { x: 0, y: 0 };
        let pointB = { x: 0, y: 0 };
        let pointM = { x: 0, y: 0 };
        
        // Visibility Flags
        let showPerp = true;
        let showRadii = false;
        let isConverseMode = false;

        // Interaction state
        let activeHandle = null;
        let hoverHandle = null;
        const TOUCH_TARGET_RADIUS = 30; // Larger touch area for mobile/tablets

        // Proof Mode Steps
        let currentProofStep = 0;
        const proofSteps = [
            {
                title: "1. Given & Construction",
                text: "Given a circle with centre O and chord AB. Draw perpendicular OM ⊥ AB. Join OA and OB to form two right triangles: △OMA and △OMB.",
                showRadii: true
            },
            {
                title: "2. Hypotenuse Equality",
                text: "OA = OB because both are radii of the same circle. (Hypotenuse equal)",
                showRadii: true
            },
            {
                title: "3. Common Leg",
                text: "OM = OM because it is a shared (common) side for both triangles.",
                showRadii: true
            },
            {
                title: "4. RHS Congruence",
                text: "∠OMA = ∠OMB = 90°. By RHS Criteria, △OMA ≅ △OMB.",
                showRadii: true
            },
            {
                title: "5. Conclusion (CPCT)",
                text: "Since triangles are congruent, AM = MB (Corresponding Parts of Congruent Triangles). The perpendicular bisects the chord!",
                showRadii: true
            }
        ];

        // Challenge Questions
        let currentChallenge = 0;
        const challenges = [
            {
                q: "If chord AB = 16 cm and radius OA = 10 cm, how far is the chord from the centre (OM)?",
                options: ["6 cm", "8 cm", "12 cm", "5 cm"],
                correct: 0,
                hint: "Use Pythagoras Theorem in △OMA: OM² = OA² - AM². Note AM = AB / 2 = 8 cm."
            },
            {
                q: "If perpendicular distance OM = 5 cm and radius = 13 cm, what is total length of chord AB?",
                options: ["12 cm", "18 cm", "24 cm", "26 cm"],
                correct: 2,
                hint: "AM² = 13² - 5² = 144, so AM = 12 cm. Chord AB = 2 × AM."
            },
            {
                q: "What happens to the distance of a chord from the centre (OM) as the chord length increases?",
                options: ["Distance increases", "Distance decreases", "Distance stays same", "Becomes zero always"],
                correct: 1,
                hint: "Drag points on screen so chord AB gets longer and observe OM length!"
            }
        ];

        function init() {
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            setupTouchAndMouse();
            showToast("Drag handles A or B to interact!");
        }

        function resizeCanvas() {
            width = canvasHolder.clientWidth;
            height = canvasHolder.clientHeight;
            
            // DPR handling for crisp high-resolution mobile/tablet screens
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr);

            center = { x: width / 2, y: height / 2 };
            radius = Math.min(width, height) * 0.35;
            draw();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function updateGeometry() {
            pointA = {
                x: center.x + radius * Math.cos(angleA),
                y: center.y + radius * Math.sin(angleA)
            };
            pointB = {
                x: center.x + radius * Math.cos(angleB),
                y: center.y + radius * Math.sin(angleB)
            };

            // Midpoint of AB (M)
            pointM = {
                x: (pointA.x + pointB.x) / 2,
                y: (pointA.y + pointB.y) / 2
            };

            // Calculate metrics
            const lenAM = Math.hypot(pointM.x - pointA.x, pointM.y - pointA.y) / (radius / 10);
            const lenMB = Math.hypot(pointB.x - pointM.x, pointB.y - pointM.y) / (radius / 10);
            
            document.getElementById('val-am').innerText = lenAM.toFixed(1);
            document.getElementById('val-mb').innerText = lenMB.toFixed(1);
            document.getElementById('val-angle').innerText = "90°";
            
            const isEqual = Math.abs(lenAM - lenMB) < 0.01;
            const equalEl = document.getElementById('val-equal');
            equalEl.innerText = isEqual ? "YES" : "NO";
            equalEl.style.color = isEqual ? "var(--accent-green)" : "var(--accent-orange)";
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            updateGeometry();

            // 1. Draw Main Circle
            ctx.beginPath();
            ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 2. Draw Radii if enabled
            if (showRadii) {
                ctx.beginPath();
                ctx.moveTo(center.x, center.y);
                ctx.lineTo(pointA.x, pointA.y);
                ctx.lineTo(pointM.x, pointM.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(74, 222, 128, 0.15)';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(center.x, center.y);
                ctx.lineTo(pointB.x, pointB.y);
                ctx.lineTo(pointM.x, pointM.y);
                ctx.closePath();
                ctx.fillStyle = 'rgba(251, 146, 60, 0.15)';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(center.x, center.y);
                ctx.lineTo(pointA.x, pointA.y);
                ctx.moveTo(center.x, center.y);
                ctx.lineTo(pointB.x, pointB.y);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 3. Draw Chord AB
            ctx.beginPath();
            ctx.moveTo(pointA.x, pointA.y);
            ctx.lineTo(pointB.x, pointB.y);
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Colored Segments
            ctx.beginPath();
            ctx.moveTo(pointA.x, pointA.y);
            ctx.lineTo(pointM.x, pointM.y);
            ctx.strokeStyle = 'var(--accent-green)';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(pointM.x, pointM.y);
            ctx.lineTo(pointB.x, pointB.y);
            ctx.strokeStyle = 'var(--accent-orange)';
            ctx.lineWidth = 4;
            ctx.stroke();

            // 4. Draw Perpendicular Line OM
            if (showPerp) {
                ctx.beginPath();
                ctx.moveTo(center.x, center.y);
                ctx.lineTo(pointM.x, pointM.y);
                ctx.strokeStyle = isConverseMode ? 'var(--accent-purple)' : 'var(--accent-blue)';
                ctx.lineWidth = 3;
                ctx.stroke();

                drawRightAngleSymbol(center, pointM, pointA);
            }

            // 5. Equal tick marks
            drawTickMark(pointA, pointM);
            drawTickMark(pointM, pointB);

            // 6. Draw Points / Handles
            drawPoint(center, 'O', '#f8fafc', 6);
            drawPoint(pointA, 'A', hoverHandle === 'A' ? '#38bdf8' : '#f8fafc', 10);
            drawPoint(pointB, 'B', hoverHandle === 'B' ? '#38bdf8' : '#f8fafc', 10);
            if (showPerp) {
                drawPoint(pointM, 'M', 'var(--accent-blue)', 7);
            }
        }

        function drawPoint(p, label, color, pointRadius = 8) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, pointRadius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.font = 'bold 14px system-ui';
            ctx.fillStyle = '#f8fafc';
            
            const angle = Math.atan2(p.y - center.y, p.x - center.x);
            const dist = pointRadius + 14;
            const lx = p.x + Math.cos(angle) * dist;
            const ly = p.y + Math.sin(angle) * dist;
            
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, lx, ly);
        }

        function drawRightAngleSymbol(pCenter, pM, pA) {
            const size = 10;
            const vMO = { x: pCenter.x - pM.x, y: pCenter.y - pM.y };
            const lenMO = Math.hypot(vMO.x, vMO.y);
            if (lenMO === 0) return;
            const uMO = { x: (vMO.x / lenMO) * size, y: (vMO.y / lenMO) * size };

            const vMA = { x: pA.x - pM.x, y: pA.y - pM.y };
            const lenMA = Math.hypot(vMA.x, vMA.y);
            if (lenMA === 0) return;
            const uMA = { x: (vMA.x / lenMA) * size, y: (vMA.y / lenMA) * size };

            ctx.beginPath();
            ctx.moveTo(pM.x + uMO.x, pM.y + uMO.y);
            ctx.lineTo(pM.x + uMO.x + uMA.x, pM.y + uMO.y + uMA.y);
            ctx.lineTo(pM.x + uMA.x, pM.y + uMA.y);
            ctx.strokeStyle = 'var(--accent-blue)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawTickMark(p1, p2) {
            const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
            const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
            const perpAngle = angle + Math.PI / 2;
            const len = 5;

            ctx.beginPath();
            ctx.moveTo(mid.x + Math.cos(perpAngle) * len, mid.y + Math.sin(perpAngle) * len);
            ctx.lineTo(mid.x - Math.cos(perpAngle) * len, mid.y - Math.sin(perpAngle) * len);
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Mouse & Touch Drag Handling (Optimized for Mobile)
        function setupTouchAndMouse() {
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const findHandle = (pos) => {
                if (Math.hypot(pos.x - pointA.x, pos.y - pointA.y) < TOUCH_TARGET_RADIUS) return 'A';
                if (Math.hypot(pos.x - pointB.x, pos.y - pointB.y) < TOUCH_TARGET_RADIUS) return 'B';
                return null;
            };

            const startDrag = (e) => {
                const pos = getPos(e);
                activeHandle = findHandle(pos);
            };

            const moveDrag = (e) => {
                const pos = getPos(e);
                hoverHandle = findHandle(pos);
                canvas.style.cursor = hoverHandle ? 'pointer' : 'default';

                if (!activeHandle) return;

                let newAngle = Math.atan2(pos.y - center.y, pos.x - center.x);
                
                if (activeHandle === 'A') {
                    angleA = newAngle;
                } else if (activeHandle === 'B') {
                    angleB = newAngle;
                }
                draw();
            };

            const endDrag = () => {
                activeHandle = null;
            };

            canvas.addEventListener('mousedown', startDrag);
            canvas.addEventListener('mousemove', moveDrag);
            window.addEventListener('mouseup', endDrag);

            canvas.addEventListener('touchstart', (e) => { startDrag(e); }, { passive: true });
            canvas.addEventListener('touchmove', (e) => { moveDrag(e); }, { passive: true });
            window.addEventListener('touchend', endDrag);
        }

        // Control Toggles
        function togglePerp() {
            showPerp = !showPerp;
            document.getElementById('tog-perp').classList.toggle('active', showPerp);
            draw();
        }

        function toggleRadii() {
            showRadii = !showRadii;
            document.getElementById('tog-radii').classList.toggle('active', showRadii);
            draw();
        }

        function toggleBisectMode() {
            isConverseMode = !isConverseMode;
            document.getElementById('tog-bisect').classList.toggle('active', isConverseMode);
            
            const inst = document.getElementById('instruction-text');
            if (isConverseMode) {
                inst.innerText = "Converse Theorem: A line drawn through the centre of a circle to bisect a chord is perpendicular to the chord.";
            } else {
                inst.innerText = "Drag handles A or B to adjust the chord. Notice how the perpendicular segment (OM) always bisects the chord into equal halves (AM = MB).";
            }
            draw();
        }

        // Mode Navigation
        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${newMode}`).classList.add('active');

            const dataCard = document.getElementById('data-card');
            const controlCard = document.getElementById('control-card');
            const interactiveCard = document.getElementById('interactive-card');
            const instText = document.getElementById('instruction-text');

            if (mode === 'explore') {
                dataCard.style.display = 'block';
                controlCard.style.display = 'block';
                interactiveCard.style.display = 'none';
                instText.innerText = "Drag the handles on the circle (A or B) to adjust the chord. Observe how OM always divides AB into two equal segments (AM = MB).";
                showRadii = false;
                document.getElementById('tog-radii').classList.remove('active');
            } else if (mode === 'proof') {
                dataCard.style.display = 'none';
                controlCard.style.display = 'none';
                interactiveCard.style.display = 'block';
                currentProofStep = 0;
                renderProofStep();
            } else if (mode === 'challenge') {
                dataCard.style.display = 'block';
                controlCard.style.display = 'none';
                interactiveCard.style.display = 'block';
                currentChallenge = 0;
                renderChallenge();
            }
            draw();
        }

        function renderProofStep() {
            const step = proofSteps[currentProofStep];
            showRadii = step.showRadii;
            
            document.getElementById('panel-title').innerText = `Proof (${currentProofStep + 1}/${proofSteps.length})`;
            document.getElementById('instruction-text').innerText = step.text;

            const content = document.getElementById('interactive-content');
            document.getElementById('interactive-title').innerText = step.title;
            
            content.innerHTML = `
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <button class="action-btn" style="background:var(--border-color); color:white;" 
                        onclick="prevProofStep()" ${currentProofStep === 0 ? 'disabled style="opacity:0.4"' : ''}>Back</button>
                    <button class="action-btn" onclick="nextProofStep()">
                        ${currentProofStep === proofSteps.length - 1 ? 'Finish' : 'Next Step'}
                    </button>
                </div>
            `;
            draw();
        }

        function nextProofStep() {
            if (currentProofStep < proofSteps.length - 1) {
                currentProofStep++;
                renderProofStep();
            } else {
                setMode('explore');
            }
        }

        function prevProofStep() {
            if (currentProofStep > 0) {
                currentProofStep--;
                renderProofStep();
            }
        }

        function renderChallenge() {
            const ch = challenges[currentChallenge];
            document.getElementById('panel-title').innerText = `Challenge ${currentChallenge + 1}/${challenges.length}`;
            document.getElementById('instruction-text').innerText = ch.q;

            const content = document.getElementById('interactive-content');
            document.getElementById('interactive-title').innerText = "Select Answer";

            let optionsHTML = ch.options.map((opt, idx) => 
                `<button class="quiz-option" onclick="checkAnswer(${idx})">${opt}</button>`
            ).join('');

            content.innerHTML = `
                ${optionsHTML}
                <div id="quiz-feedback" class="quiz-feedback"></div>
                <div style="font-size:0.75rem; color:var(--text-muted); margin-top:6px;">💡 Hint: ${ch.hint}</div>
            `;
        }

        function checkAnswer(idx) {
            const ch = challenges[currentChallenge];
            const feedback = document.getElementById('quiz-feedback');
            if (idx === ch.correct) {
                feedback.style.color = 'var(--accent-green)';
                feedback.innerText = 'Correct! Great job!';
                setTimeout(() => {
                    currentChallenge = (currentChallenge + 1) % challenges.length;
                    renderChallenge();
                }, 1600);
            } else {
                feedback.style.color = 'var(--accent-orange)';
                feedback.innerText = 'Incorrect. Try using the hint below!';
            }
        }

        window.onload = init;
    </script>
</body>
</html>
