<script>
(function () {
  // ---------- Data ----------
  const angleQuestions = [
    { a: 50, b: 60, label: ['A','B','C'] },
    { a: 90, b: 35, label: ['A','B','C'] },
    { a: 40, b: 40, label: ['A','B','C'] },
    { a: 100, b: 45, label: ['A','B','C'] },
    { a: 30, b: 70, label: ['A','B','C'] },
  ];

  // sides: [a,b,c] opposite angles [A,B,C]; question: which angle is largest
  const sideQuestions = [
    { sides: [5, 7, 9], askLargest: true },
    { sides: [8, 8, 5], askLargest: false }, // ask smallest
    { sides: [6, 10, 7], askLargest: true },
    { sides: [12, 5, 9], askLargest: false },
    { sides: [4, 4, 4], askLargest: true },
  ];

  const ineqQuestions = [
    { sides: [4, 5, 9] },   // 4+5=9, not > 9 -> invalid
    { sides: [3, 4, 5] },   // valid
    { sides: [2, 2, 5] },   // invalid
    { sides: [7, 8, 10] },  // valid
    { sides: [5, 5, 10] },  // invalid (equal, not strictly greater)
    { sides: [6, 7, 8] },   // valid
  ];

  let state = {
    section: 'angle',
    idx: { angle: 0, sides: 0, ineq: 0 },
    answered: { angle: false, sides: false, ineq: false }
  };

  const panel = document.getElementById('panel');
  const tabs = {
    angle: document.getElementById('tab-angle'),
    sides: document.getElementById('tab-sides'),
    ineq: document.getElementById('tab-ineq')
  };

  Object.keys(tabs).forEach(key => {
    tabs[key].addEventListener('click', () => switchSection(key));
  });

  function switchSection(key) {
    state.section = key;
    Object.keys(tabs).forEach(k => {
      tabs[k].classList.toggle('active', k === key);
      tabs[k].setAttribute('aria-selected', k === key ? 'true' : 'false');
    });
    render();
  }

  // ---------- Generic triangle SVG (fixed shape, labels change) ----------
  function triangleSVG({ topLabel, leftLabel, rightLabel, topVal, leftVal, rightVal, sideTop, sideLeft, sideBottom, highlightVertex }) {
    // Fixed vertex positions for a clear, readable triangle
    const A = { x: 150, y: 30 };   // top
    const B = { x: 30, y: 230 };   // bottom-left
    const C = { x: 270, y: 230 };  // bottom-right
    const vColor = v => highlightVertex === v ? '#7c3aed' : '#1e293b';
    return `
    <svg viewBox="0 0 300 260" role="img" aria-label="Triangle diagram">
      <polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/>
      <text x="${A.x}" y="${A.y - 10}" text-anchor="middle" font-size="15" font-weight="700" fill="${vColor('A')}">${topLabel || ''}</text>
      <text x="${B.x - 18}" y="${B.y + 10}" text-anchor="middle" font-size="15" font-weight="700" fill="${vColor('B')}">${leftLabel || ''}</text>
      <text x="${C.x + 18}" y="${C.y + 10}" text-anchor="middle" font-size="15" font-weight="700" fill="${vColor('C')}">${rightLabel || ''}</text>
      ${topVal !== undefined ? `<text x="${A.x}" y="${A.y + 26}" text-anchor="middle" font-size="14" fill="#334155">${topVal}</text>` : ''}
      ${leftVal !== undefined ? `<text x="${B.x + 22}" y="${B.y - 14}" text-anchor="middle" font-size="14" fill="#334155">${leftVal}</text>` : ''}
      ${rightVal !== undefined ? `<text x="${C.x - 22}" y="${C.y - 14}" text-anchor="middle" font-size="14" fill="#334155">${rightVal}</text>` : ''}
      ${sideTop !== undefined ? `<text x="${(B.x+C.x)/2}" y="${B.y + 22}" text-anchor="middle" font-size="14" fill="#475569">${sideTop}</text>` : ''}
      ${sideLeft !== undefined ? `<text x="${(A.x+B.x)/2 - 22}" y="${(A.y+B.y)/2}" text-anchor="middle" font-size="14" fill="#475569">${sideLeft}</text>` : ''}
      ${sideBottom !== undefined ? `<text x="${(A.x+C.x)/2 + 22}" y="${(A.y+C.y)/2}" text-anchor="middle" font-size="14" fill="#475569">${sideBottom}</text>` : ''}
    </svg>`;
  }

  // ---------- Render dispatch ----------
  function render() {
    if (state.section === 'angle') renderAngle();
    else if (state.section === 'sides') renderSides();
    else renderIneq();
  }

  // ---------- Section 1: Angle Sum Property ----------
  function renderAngle() {
    const i = state.idx.angle;
    const q = angleQuestions[i];
    const missing = 180 - q.a - q.b;
    panel.innerHTML = `
      <h2>Angle Sum Property of a Triangle</h2>
      <p class="desc">The three interior angles of any triangle always add up to 180°.</p>
      <div class="progress">Example ${i + 1} of ${angleQuestions.length}</div>
      <div class="question-area">
        <div class="svg-box">
          ${triangleSVG({ topLabel: 'A', leftLabel: 'B', rightLabel: 'C', topVal: q.a + '°', leftVal: q.b + '°', rightVal: '?' })}
        </div>
        <div class="controls-box">
          <div class="prompt">Angle A = ${q.a}°, Angle B = ${q.b}°. What is Angle C?</div>
          <input type="number" id="angleInput" aria-label="Your answer for angle C in degrees" placeholder="Degrees">
          <span>°</span>
          <div class="action-row">
            <button class="action btn-primary" id="checkAngle">Check Answer</button>
            <button class="action btn-secondary" id="nextAngle">Next Example</button>
            <button class="action btn-secondary" id="resetAngle">Reset</button>
          </div>
          <div id="feedback"></div>
        </div>
      </div>
    `;
    document.getElementById('checkAngle').addEventListener('click', () => {
      const val = parseFloat(document.getElementById('angleInput').value);
      const fb = document.getElementById('feedback');
      if (isNaN(val)) {
        showFeedback(fb, false, 'Enter a number for Angle C before checking.', '');
        return;
      }
      if (val === missing) {
        showFeedback(fb, true, `Correct! Angle C = ${missing}°.`,
          `Since angles in a triangle sum to 180°: ${q.a}° + ${q.b}° + ${missing}° = 180°.`);
      } else {
        showFeedback(fb, false, `Not quite. Angle C = ${missing}°, not ${val}°.`,
          `All three angles must add up to 180°, so Angle C = 180° − ${q.a}° − ${q.b}° = ${missing}°.`);
      }
    });
    document.getElementById('nextAngle').addEventListener('click', () => {
      state.idx.angle = (state.idx.angle + 1) % angleQuestions.length;
      renderAngle();
    });
    document.getElementById('resetAngle').addEventListener('click', renderAngle);
  }

  // ---------- Section 2: Sides & Angles relationship ----------
  function renderSides() {
    const i = state.idx.sides;
    const q = sideQuestions[i];
    const [a, b, c] = q.sides; // a opposite A(top), b opposite B(left)... we'll map: side BC opposite A, side AC opposite B, side AB opposite C
    // Simplify: label sides as BC(a) opposite A, CA(b) opposite B, AB(c) opposite C
    const [sideBC, sideCA, sideAB] = q.sides;
    const angles = { A: sideBC, B: sideCA, C: sideAB }; // larger side -> larger opposite angle
    const sortedDesc = Object.entries(angles).sort((x, y) => y[1] - x[1]);
    const largest = sortedDesc[0][0];
    const smallest = sortedDesc[sortedDesc.length - 1][0];
    const askingFor = q.askLargest ? 'largest' : 'smallest';
    const correctAnswer = q.askLargest ? largest : smallest;

    panel.innerHTML = `
      <h2>Relationship Between Sides and Angles</h2>
      <p class="desc">In any triangle, the longer side is always opposite the larger angle, and the shorter side is opposite the smaller angle.</p>
      <div class="progress">Example ${i + 1} of ${sideQuestions.length}</div>
      <div class="question-area">
        <div class="svg-box">
          ${triangleSVG({ topLabel: 'A', leftLabel: 'B', rightLabel: 'C', sideTop: sideBC, sideLeft: sideCA, sideBottom: sideAB })}
        </div>
        <div class="controls-box">
          <div class="prompt">Side BC = ${sideBC}, Side CA = ${sideCA}, Side AB = ${sideAB}.<br>Which angle is the <strong>${askingFor}</strong>?</div>
          <div class="choice-row" id="choiceRow">
            <button class="choice-btn" data-choice="A">Angle A</button>
            <button class="choice-btn" data-choice="B">Angle B</button>
            <button class="choice-btn" data-choice="C">Angle C</button>
          </div>
          <div class="action-row">
            <button class="action btn-secondary" id="nextSides">Next Example</button>
            <button class="action btn-secondary" id="resetSides">Reset</button>
          </div>
          <div id="feedback"></div>
        </div>
      </div>
    `;
    document.querySelectorAll('#choiceRow .choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const choice = btn.dataset.choice;
        const fb = document.getElementById('feedback');
        document.querySelectorAll('#choiceRow .choice-btn').forEach(b => {
          b.classList.remove('chosen-correct', 'chosen-wrong');
          b.disabled = true;
        });
        if (choice === correctAnswer) {
          btn.classList.add('chosen-correct');
          showFeedback(fb, true, `Correct! Angle ${correctAnswer} is the ${askingFor}.`,
            `Side lengths: BC=${sideBC} (opposite A), CA=${sideCA} (opposite B), AB=${sideAB} (opposite C). The ${askingFor} side is opposite the ${askingFor} angle.`);
        } else {
          btn.classList.add('chosen-wrong');
          const correctBtn = document.querySelector(`#choiceRow [data-choice="${correctAnswer}"]`);
          if (correctBtn) correctBtn.classList.add('chosen-correct');
          showFeedback(fb, false, `Not quite. Angle ${correctAnswer} is actually the ${askingFor}.`,
            `Side lengths: BC=${sideBC} (opposite A), CA=${sideCA} (opposite B), AB=${sideAB} (opposite C). The ${askingFor} side is opposite the ${askingFor} angle.`);
        }
      });
    });
    document.getElementById('nextSides').addEventListener('click', () => {
      state.idx.sides = (state.idx.sides + 1) % sideQuestions.length;
      renderSides();
    });
    document.getElementById('resetSides').addEventListener('click', renderSides);
  }

  // ---------- Section 3: Triangle Inequality ----------
  function renderIneq() {
    const i = state.idx.ineq;
    const q = ineqQuestions[i];
    const [x, y, z] = q.sides.slice().sort((p, q2) => p - q2);
    const isValid = (x + y) > z;

    panel.innerHTML = `
      <h2>Triangle Inequality</h2>
      <p class="desc">The sum of the lengths of any two sides of a triangle must be greater than the length of the third side.</p>
      <div class="progress">Example ${i + 1} of ${ineqQuestions.length}</div>
      <div class="question-area">
        <div class="svg-box">
          ${triangleSVG({ sideTop: q.sides[0], sideLeft: q.sides[1], sideBottom: q.sides[2] })}
        </div>
        <div class="controls-box">
          <div class="prompt">Can side lengths ${q.sides[0]}, ${q.sides[1]}, and ${q.sides[2]} form a triangle?</div>
          <div class="choice-row" id="choiceRowIneq">
            <button class="choice-btn" data-choice="yes">Yes</button>
            <button class="choice-btn" data-choice="no">No</button>
          </div>
          <div class="action-row">
            <button class="action btn-secondary" id="nextIneq">Next Example</button>
            <button class="action btn-secondary" id="resetIneq">Reset</button>
          </div>
          <div id="feedback"></div>
        </div>
      </div>
    `;
    document.querySelectorAll('#choiceRowIneq .choice-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const choice = btn.dataset.choice === 'yes';
        const fb = document.getElementById('feedback');
        document.querySelectorAll('#choiceRowIneq .choice-btn').forEach(b => {
          b.classList.remove('chosen-correct', 'chosen-wrong');
          b.disabled = true;
        });
        const reason = `The two shorter sides are ${x} and ${y}; their sum is ${x + y}. The longest side is ${z}. `
          + (isValid
              ? `Since ${x} + ${y} = ${x+y} > ${z}, these lengths CAN form a triangle.`
              : `Since ${x} + ${y} = ${x+y} is NOT greater than ${z}, these lengths CANNOT form a triangle.`);
        if (choice === isValid) {
          btn.classList.add('chosen-correct');
          showFeedback(fb, true, 'Correct!', reason);
        } else {
          btn.classList.add('chosen-wrong');
          const correctBtn = document.querySelector(`#choiceRowIneq [data-choice="${isValid ? 'yes' : 'no'}"]`);
          if (correctBtn) correctBtn.classList.add('chosen-correct');
          showFeedback(fb, false, `Not quite. The correct answer is "${isValid ? 'Yes' : 'No'}".`, reason);
        }
      });
    });
    document.getElementById('nextIneq').addEventListener('click', () => {
      state.idx.ineq = (state.idx.ineq + 1) % ineqQuestions.length;
      renderIneq();
    });
    document.getElementById('resetIneq').addEventListener('click', renderIneq);
  }

  // ---------- Feedback helper ----------
  function showFeedback(fbEl, success, headline, explanation) {
    fbEl.classList.add('show');
    fbEl.classList.toggle('success', success);
    fbEl.classList.toggle('error', !success);
    fbEl.innerHTML = `${headline}${explanation ? `<span class="expl">${explanation}</span>` : ''}`;
  }

  render();
})();
</script>
<script id="topic-preset-script">
/* Topic presets use reusable mathematical values, never question identifiers. */
(() => {
  'use strict';
  const schema = {"angle_a": {"label": "Angle A (°)", "default": 50, "min": 1, "max": 178, "integer": false}, "angle_b": {"label": "Angle B (°)", "default": 60, "min": 1, "max": 178, "integer": false}, "focus": {"label": "Explore", "default": "angles", "options": ["angles", "angle-sum", "isosceles", "equilateral", "exterior"]}};
  const params = new URLSearchParams(location.search);
  if (!Object.keys(schema).some(key => params.has(key))) return;
  const state = {}, invalid = [];
  for (const [key, spec] of Object.entries(schema)) {
    const raw = params.get(key);
    let value = spec.default;
    if (raw !== null) {
      if (spec.options) { if (spec.options.includes(raw)) value = raw; else invalid.push(key); }
      else if (spec.type === 'text') { if (raw.length <= 180 && spec.pattern.test(raw)) value = raw; else invalid.push(key); }
      else { const number = Number(raw); if (raw.trim() && Number.isFinite(number) && number >= spec.min && number <= spec.max && (!spec.integer || Number.isInteger(number))) value = number; else invalid.push(key); }
    }
    state[key] = value;
  }
  const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const fmt = value => Number.isFinite(value) ? String(Number(value.toFixed(6))) : 'undefined';
  const gcd = (a,b) => b ? gcd(b,a%b) : a;
  const fraction = value => { for(let d=1;d<=144;d++){const n=Math.round(value*d);if(Math.abs(n/d-value)<1e-8)return d===1?String(n):`${n}/${d}`;}return fmt(value); };
  const svg = body => `<svg viewBox="0 0 600 280" role="img" aria-label="${esc(title)} diagram">${body}</svg>`;
  const line = (x1,y1,x2,y2,color='#2563eb',dash='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="3" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
  const text = (x,y,value,color='#172033') => `<text x="${x}" y="${y}" fill="${color}" font-size="18" text-anchor="middle">${esc(value)}</text>`;
  const polygon = (points,color='#2563eb') => `<polygon points="${points}" fill="${color}18" stroke="${color}" stroke-width="3"/>`;
  const note = (heading,body) => `<h3>${esc(heading)}</h3><p>${body}</p>`;
  const factors = n => { const out=[]; for(let i=1;i<=Math.sqrt(n);i++)if(n%i===0){out.push(i);if(i*i!==n)out.push(n/i);}return out.sort((a,b)=>a-b); };
  const primes = n => {const out=[];for(let p=2;p*p<=n;p++)while(n%p===0){out.push(p);n/=p;}if(n>1)out.push(n);return out;};
  const setInput = (id,value,event='input') => {const el=document.getElementById(id);if(!el)return;if(el.type==='range'){el.min=Math.min(Number(el.min),value);el.max=Math.max(Number(el.max),value);el.step='any';}el.value=value;el.dispatchEvent(new Event(event,{bubbles:true}));};
  const title = "Explore triangle angles";

  function render(s){const a=s.angle_a,b=s.angle_b,c=180-a-b;if(c<=0)return note('These angles cannot form a triangle','Two interior angles must add to less than 180°.');
    const rad=Math.PI/180,base=250;
    // Sine rule gives a stable, correctly shaped triangle, including obtuse angles.
    const side=base*Math.sin(b*rad)/Math.sin(c*rad),x=side*Math.cos(a*rad),y=side*Math.sin(a*rad);
    const pts=[[0,0],[base,0],[x,y]],xs=pts.map(p=>p[0]),maxY=Math.max(y,1),minX=Math.min(...xs),maxX=Math.max(...xs),k=Math.min(390/(maxX-minX),160/maxY),X=v=>100+(v-minX)*k,Y=v=>220-v*k;
    let drawing=polygon(`${X(0)},220 ${X(base)},220 ${X(x)},${Y(y)}`)+text(X(0)-20,245,`A ${fmt(a)}°`)+text(X(base)+15,245,`B ${fmt(b)}°`)+text(X(x),Y(y)-15,`C ${fmt(c)}°`);
    if(s.focus==='exterior')drawing+=line(X(base),220,560,220,'#db2777')+text(500,200,`exterior ${fmt(180-b)}°`,'#db2777');
    if(s.focus==='angle-sum')drawing+=line(40,Y(y),560,Y(y),'#db2777','6 4')+text(300,20,'Parallel to AB: alternate angles make a straight angle');
    return svg(drawing)+`<p class="preset-equation">A + B + C = 180° → C = 180° − ${fmt(a)}° − ${fmt(b)}° = ${fmt(c)}°</p>`+note(s.focus==='exterior'?'Why the exterior angle is a sum':'Why the angle sum is 180°',s.focus==='exterior'?`The exterior angle and B form a straight line, so exterior = 180° − B = A + C = ${fmt(a+c)}°. The remote interior angles are A and C.`:'Draw a line through C parallel to AB. The angles matching A and B are alternate interior angles. Together with C, they fill a straight angle of 180°. This works for every triangle.')+note('Identify the triangle',a===60&&b===60?'All angles are 60°. Equal angles face equal sides, so this is equilateral.':a===b||a===c||b===c?'Two equal angles face two equal sides: an isosceles triangle.':'Unequal angles face unequal sides. A 90° angle identifies a right triangle.');
  }
  function sync(s){}

  function mount() {
    const style=document.createElement('style');style.textContent=`#topic-preset{box-sizing:border-box;max-width:1200px;width:calc(100% - 24px);margin:18px auto;padding:20px;border:2px solid #2563eb;border-radius:16px;background:#f8fafc;color:#172033;font:16px/1.5 system-ui,sans-serif;text-align:left}#topic-preset h2{margin:0 0 6px;font-size:24px;color:#172033}#topic-preset h3{margin:16px 0 6px;font-size:19px;color:#172033}#topic-preset p{margin:8px 0;color:#172033}#topic-preset .preset-controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}#topic-preset label{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:0;font-size:14px;color:#172033}#topic-preset input,#topic-preset select{box-sizing:border-box;width:100%;padding:8px;border:1px solid #64748b;border-radius:6px;background:white;color:#172033;font:inherit;min-width:0}#topic-preset svg{display:block;width:100%;max-height:340px;background:white;border-radius:8px}#topic-preset .preset-result{overflow-wrap:anywhere}#topic-preset .preset-equation{font-size:20px;font-weight:700;color:#174aa0}#topic-preset a{color:#174aa0;text-decoration:underline}#topic-preset .preset-error{color:#9f1239}#topic-preset .preset-tiles{display:flex;flex-wrap:wrap;gap:8px}#topic-preset .preset-tile{background:#dbeafe;border-radius:8px;padding:6px 12px}#topic-preset table{width:100%;border-collapse:collapse;font-size:15px}#topic-preset th,#topic-preset td{border:1px solid #cbd5e1;padding:6px;text-align:center;color:#172033}#topic-preset .preset-scroll{overflow-x:auto} @media(max-width:480px){#topic-preset{padding:12px}#topic-preset .preset-equation{font-size:17px}}`;
    document.head.append(style);
    const section=document.createElement('section');section.id='topic-preset';section.setAttribute('aria-label','Explore the URL setup');
    section.innerHTML=`<h2>${esc(title)}</h2><p>Change the values to explore this topic. The link below shares the current setup.</p>${invalid.length?`<p class="preset-error">Invalid URL values for ${esc(invalid.join(', '))}; using the defaults shown below.</p>`:''}<form class="preset-controls"></form><div class="preset-result" aria-live="polite"></div><p><a class="preset-share">Open or copy this setup</a></p>`;
    document.body.insertBefore(section,document.body.firstChild);
    const form=section.querySelector('form');const more=document.createElement('details');more.innerHTML='<summary>More exploration settings</summary>';const extra=document.createElement('div');extra.className='preset-controls';more.append(extra);section.insertBefore(more,section.querySelector('.preset-result'));form.addEventListener('submit',event=>event.preventDefault());
    for(const [key,spec] of Object.entries(schema)){
      const label=document.createElement('label');label.textContent=spec.label;
      const input=document.createElement(spec.options?'select':'input');input.name=key;input.id='preset-'+key;
      if(spec.options)for(const value of spec.options){const option=document.createElement('option');option.value=value;option.textContent=value.replaceAll('-',' ');input.append(option);}
      else {input.type=spec.type==='text'?'text':'number';if(input.type==='number'){input.min=spec.min;input.max=spec.max;input.step=spec.integer?'1':'any';}}
      input.value=state[key];label.append(input);(params.has(key)?form:extra).append(label);
      input.addEventListener('change',()=>{const value=input.type==='number'?Number(input.value):input.value;const valid=spec.options?spec.options.includes(value):spec.type==='text'?value.length<=180&&spec.pattern.test(value):input.value.trim()&&Number.isFinite(value)&&value>=spec.min&&value<=spec.max&&(!spec.integer||Number.isInteger(value));if(!valid){input.value=state[key];return;}state[key]=value;refresh();});
    }
    function refresh(){const result=section.querySelector('.preset-result');result.innerHTML=render(state);const url=new URL(location.href);for(const key of Object.keys(schema))url.searchParams.set(key,state[key]);section.querySelector('.preset-share').href=url.href;sync(state);}
    refresh();
  }
  if(document.readyState==='complete')mount();else window.addEventListener('load',mount,{once:true});
})();

</script>
